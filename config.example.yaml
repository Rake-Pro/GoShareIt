# GoShareIt configuration example.
# Copy to config.yaml (gitignored) and edit. NEVER put the password inline:
# point password_file at a 0600 file, or password_env at an env var name.

nextcloud:
  base_url: https://cloud.rake.pro
  username: imgshare@rake.pro
  # dav_user is optional; if empty it is derived from the part of username
  # before '@' (e.g. "imgshare"). The live server validated with "imgshare".
  dav_user: ""
  # Provide exactly ONE of password_file or password_env.
  # A leading ~ is expanded to your home dir. Create the file with:
  #   mkdir -p ~/.config/goshareit
  #   printf '%s' 'YOUR_APP_PASSWORD' > ~/.config/goshareit/app-password.secret
  #   chmod 600 ~/.config/goshareit/app-password.secret
  password_file: ~/.config/goshareit/app-password.secret
  # password_env: GOSHAREIT_NC_PASSWORD
  remote_dir: ""   # "" = account files root

upload:
  direct_link: true                                   # copy the raw-bytes /download link
  filename_template: "goshareit_{datetime}_{rand}.{ext}"
  share_expire_days: 0                                # 0 = never expire
  share_password: ""                                  # optional public-link password

after_capture:
  copy_image_to_clipboard: false
  save_local: false
  save_dir: ""

after_upload:
  copy_url_to_clipboard: true
  notify: true

hotkeys:
  region: "Cmd+Shift+1"
  fullscreen: "Cmd+Shift+9"
  window: "Cmd+Shift+0"
  record: "Cmd+Shift+R"   # toggle screen recording (only on builds that support it)
  quit: "Cmd+Shift+Q"

logging:
  level: "info"
