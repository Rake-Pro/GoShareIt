# GoShareIt configuration example.
# Copy to config.yaml (gitignored) and edit. NEVER put the password inline:
# point password_file at a 0600 file, or password_env at an env var name.

nextcloud:
  base_url: https://cloud.rake.pro
  username: imgshare@rake.pro
  # dav_user is optional; if empty it is derived from the part of username
  # before '@' (e.g. "imgshare"). The live server validated with "imgshare".
  dav_user: ""
  # Provide exactly ONE of password_file or password_env.
  # A leading ~ is expanded to your home dir. The app root is ~/.goshareit on
  # macOS/Linux and ~/goshareit (%USERPROFILE%\goshareit) on Windows.
  # Create the file with:
  #   mkdir -p ~/.goshareit
  #   printf '%s' 'YOUR_APP_PASSWORD' > ~/.goshareit/app-password.secret
  #   chmod 600 ~/.goshareit/app-password.secret
  password_file: ~/.goshareit/app-password.secret
  # password_env: GOSHAREIT_NC_PASSWORD
  remote_dir: ""   # "" = account files root

upload:
  direct_link: true                                   # copy the raw-bytes /download link
  filename_template: "goshareit_{datetime}_{rand}.{ext}"
  share_expire_days: 0                                # 0 = never expire
  share_password: ""                                  # optional public-link password

after_capture:
  copy_image_to_clipboard: false
  save_local: false
  save_dir: ""

after_upload:
  copy_url_to_clipboard: true
  notify: true

hotkeys:
  region: "Cmd+Shift+1"
  fullscreen: "Cmd+Shift+9"
  window: "Cmd+Shift+0"
  record: "Cmd+Shift+R"   # toggle screen recording (only on builds that support it)
  quit: "Cmd+Shift+Q"

editor:
  enabled: false          # master switch; false -> current behavior (no editor)
  on_modes: [region]      # which capture modes open the editor (region|fullscreen|window)
  helper_path: ""         # "" -> goshareit-editor next to the host binary
  timeout_seconds: 0      # 0 -> no timeout
  default_tool: arrow
  stroke_width: 3
  color: "#ff3b30"
  tools: [crop, arrow, rect, text, blur, highlight, step]

update:
  enabled: true           # self-update from GitHub Releases
  repo: Rake-Pro/GoShareIt
  # Optional while the repo is private: path to a file holding a fine-grained
  # read-only PAT (Contents: Read on the repo above). Missing/empty file ->
  # anonymous API, which works once the repo is public.
  # (~/goshareit/github-token.secret on Windows)
  token_file: ~/.goshareit/github-token.secret
  interval_hours: 24      # background check cadence (plus one check ~30s after launch)

logging:
  level: "info"
