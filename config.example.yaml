# GoShareIt configuration example.
# Copy to config.yaml (gitignored) and edit. NEVER put the password inline:
# point password_file at a 0600 file, or password_env at an env var name.

theme: system   # light | dark | system (default); applies to the annotation
                # editor and the settings window

nextcloud:
  base_url: https://cloud.example.com
  username: uploads@example.com
  # dav_user is optional; if empty it is derived from the part of username
  # before '@' (e.g. "uploads").
  dav_user: ""
  # Provide exactly ONE of password_file or password_env.
  # A leading ~ is expanded to your home dir. The app root is ~/.goshareit on
  # macOS/Linux and ~/goshareit (%USERPROFILE%\goshareit) on Windows.
  # Create the file with:
  #   mkdir -p ~/.goshareit
  #   printf '%s' 'YOUR_APP_PASSWORD' > ~/.goshareit/app-password.secret
  #   chmod 600 ~/.goshareit/app-password.secret
  password_file: ~/.goshareit/app-password.secret
  # password_env: GOSHAREIT_NC_PASSWORD
  remote_dir: ""   # "" = account files root

upload:
  # false = local-only mode: nothing leaves this machine, the whole active
  # destination's section becomes optional, and after-upload behavior is
  # skipped. Toggle freely; credentials on disk are kept for when it is
  # re-enabled.
  enabled: true
  # Active upload destination: nextcloud | s3 | sftp | webdav | custom.
  # Only the selected destination's section (below) is validated; the others
  # can be left blank or misconfigured. direct_link/share_expire_days/
  # share_password below are Nextcloud-only and only take effect when
  # destination is nextcloud.
  destination: nextcloud
  direct_link: true                                   # copy the raw-bytes /download link
  filename_template: "goshareit_{datetime}_{rand}.{ext}"
  share_expire_days: 0                                # 0 = never expire
  share_password: ""                                  # optional public-link password

# S3-compatible storage (AWS S3, Backblaze B2, Cloudflare R2, MinIO, ...).
# Used when upload.destination is "s3".
# s3:
#   endpoint: s3.us-west-002.backblazeb2.com   # host[:port], no scheme
#   region: us-west-002
#   bucket: my-screenshots
#   access_key: YOUR_ACCESS_KEY_ID
#   # Provide exactly ONE of secret_key_file or secret_key_env.
#   secret_key_file: ~/.goshareit/s3-secret-key.secret
#   # secret_key_env: GOSHAREIT_S3_SECRET_KEY
#   prefix: ""                                 # object key prefix, joined as "prefix/name"
#   url_template: ""                           # public link template; {bucket} {key} {name}; blank = presigned GET
#   use_path_style: true                       # required by most non-AWS S3-compatible providers
#   presign_seconds: 604800                    # GET presign TTL when url_template is blank; default/max 7 days

# Plain SFTP. Used when upload.destination is "sftp".
# sftp:
#   host: files.example.com
#   port: 22
#   user: uploads
#   # Auth: a password (exactly one of password_file/password_env) or a
#   # private key (private_key_file); a key takes precedence when both are set.
#   password_file: ~/.goshareit/sftp-password.secret
#   # password_env: GOSHAREIT_SFTP_PASSWORD
#   private_key_file: ~/.goshareit/sftp-key.pem
#   # Only needed if the private key above is encrypted.
#   passphrase_file: ~/.goshareit/sftp-key-passphrase.secret
#   # passphrase_env: GOSHAREIT_SFTP_PASSPHRASE
#   remote_dir: ""
#   url_template: ""                           # public link template; placeholder {name}
#   # SHA256 fingerprint (ssh-keygen -lf format) pinning the host key. Leaving
#   # this blank is allowed but leaves the host key unverified - a startup
#   # warning is logged.
#   host_key_fingerprint: ""

# Generic WebDAV (no OCS share step - that is Nextcloud-specific).
# Used when upload.destination is "webdav".
# webdav:
#   base_url: https://webdav.example.com/remote.php/dav/files/uploads
#   username: uploads
#   # Provide at most one of password_file or password_env.
#   password_file: ~/.goshareit/webdav-password.secret
#   # password_env: GOSHAREIT_WEBDAV_PASSWORD
#   remote_dir: ""
#   url_template: ""                           # public link template; {name} {path}; blank = the PUT URL

# Generic ShareX-style HTTP uploader. Used when upload.destination is "custom".
# See internal/core/upload/presets.go (or the settings UI's preset picker) for
# ready-made imgur/catbox/0x0 starting points.
# custom:
#   method: POST
#   url: https://example.com/upload
#   headers: {}                                # values support {name} {mime} {secret}
#   body: multipart                            # multipart | raw
#   file_field: file
#   extra_fields: {}                           # multipart-only; values support {name} {mime} {secret}
#   # Provide at most one of secret_file or secret_env. The resolved secret
#   # replaces a literal "{secret}" placeholder in headers/extra_fields values.
#   secret_file: ~/.goshareit/custom-secret.secret
#   # secret_env: GOSHAREIT_CUSTOM_SECRET
#   response_url_path: ""                      # dot path into a JSON response, e.g. "data.link"
#   response_direct_url_path: ""               # same, for the direct URL; blank = same as public URL
#   response_url_regex: ""                     # used instead of response_url_path; first capture group is the URL

after_capture:
  copy_image_to_clipboard: false
  save_local: false
  save_dir: ""

after_upload:
  copy_url_to_clipboard: true
  notify: true

# First-run scaffolding uses Cmd on macOS and Ctrl on Windows; either spelling
# works everywhere (the Windows backend maps Cmd -> Ctrl at registration).
# Each value may hold comma-separated alternatives ("Cmd+Shift+1, Ctrl+PrintScreen");
# every alternative registers. PrintScreen works on macOS too (PC keyboards send
# it as F13). The *_edit variants always open the annotation editor.
hotkeys:
  region: "Cmd+Shift+1"
  fullscreen: "Cmd+Shift+9"
  window: "Cmd+Shift+0"
  region_edit: ""         # like region, but always opens the editor
  fullscreen_edit: ""
  window_edit: ""
  upload_toggle: ""    # flip uploads on/off (also in the tray menu)
  # Toggle screen recording (only on builds that support it). Avoid Cmd+Shift+R /
  # Ctrl+Shift+R: browsers use that chord for hard reload, and the global hotkey
  # swallows it while silently toggling a recording.
  record: "Cmd+Shift+2"
  # Unbound by default: Cmd+Shift+Q is the macOS logout chord and the global
  # hotkey would swallow it (Quit is always available in the tray menu).
  quit: ""

editor:
  enabled: false          # master switch; false -> current behavior (no editor)
  on_modes: [region]      # which capture modes open the editor (region|fullscreen|window)
  helper_path: ""         # "" -> goshareit-editor next to the host binary
  timeout_seconds: 0      # 0 -> no timeout
  default_tool: arrow
  stroke_width: 6       # px; 3 is near-invisible on retina-resolution captures
  color: "#ff3b30"
  tools: [crop, arrow, rect, text, blur, highlight, step]

update:
  enabled: true           # self-update from GitHub Releases
  repo: Rake-Pro/GoShareIt
  # Optional while the repo is private: path to a file holding a fine-grained
  # read-only PAT (Contents: Read on the repo above). Missing/empty file ->
  # anonymous API, which works once the repo is public.
  # (~/goshareit/github-token.secret on Windows)
  token_file: ~/.goshareit/github-token.secret
  interval_hours: 24      # background check cadence (plus one check ~30s after launch)

logging:
  level: "info"
