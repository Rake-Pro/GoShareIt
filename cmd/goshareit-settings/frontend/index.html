<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GoShareIt Settings</title>
<style>
  /* Token structure is three-state on purpose: :root carries the light
     defaults, the media block applies dark ONLY when the config has not
     forced light, and the [data-theme] blocks let applyTheme() override
     prefers-color-scheme in either direction.
     Contrast (WCAG AA, computed): white on --accent-fill #0064d2 5.59;
     light --text-secondary/--text-tertiary #636366 on #e9e9eb 4.94, on
     #fff 5.99; light --ok #12733b on #e9e9eb 4.89; light --err #b42318 on
     #e9e9eb 5.42; white on light --danger-fill 6.57; dark --text-tertiary
     #8e8e93 on #262629 4.63; dark --text-secondary on #2c2c2e 4.85; dark
     --ok 6.44 and --err 5.44 on #262629; white on dark --danger-fill
     #c53030 5.47. Non-text (3:1): --focus-ring #0a84ff on #fff 3.65, on
     #e9e9eb 3.01, on #1e1e1e 4.57, on #3a3a3c 3.11; --control-border
     #8e8e93 on #fff 3.26, on #3a3a3c 3.48, on #2c2c2e 4.27. */
  :root {
    color-scheme: light dark;
    --bg-window: #ececec;
    --bg-sidebar: #e9e9eb;
    --bg-bar: #e9e9eb;
    --bg-content: #ffffff;
    --bg-card: #ffffff;
    --bg-control: #ffffff;
    --text-primary: #1d1d1f;
    --text-secondary: #636366;
    --text-tertiary: #636366;
    --hairline: rgba(0, 0, 0, 0.12);
    --hairline-card: rgba(0, 0, 0, 0.09);
    --control-border: #8e8e93;
    --accent: #0a84ff;
    --accent-fill: #0064d2;
    --switch-off: rgba(0, 0, 0, 0.17);
    --focus-ring: #0a84ff;
    --keycap-bg: linear-gradient(180deg, #ffffff, #eeeeef);
    --ok: #12733b;
    --err: #b42318;
    --danger-fill: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-window: #1e1e1e;
      --bg-sidebar: #262629;
      --bg-bar: #262629;
      --bg-content: #1e1e1e;
      --bg-card: #2c2c2e;
      --bg-control: #3a3a3c;
      --text-primary: #f5f5f7;
      --text-secondary: #98989d;
      --text-tertiary: #8e8e93;
      --hairline: rgba(255, 255, 255, 0.13);
      --hairline-card: rgba(255, 255, 255, 0.1);
      --control-border: #8e8e93;
      --accent: #0a84ff;
      --accent-fill: #0064d2;
      --switch-off: rgba(255, 255, 255, 0.18);
      --focus-ring: #0a84ff;
      --keycap-bg: linear-gradient(180deg, #48484a, #3a3a3c);
      --ok: #34c07a;
      --err: #ff6b6b;
      --danger-fill: #c53030;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg-window: #ececec;
    --bg-sidebar: #e9e9eb;
    --bg-bar: #e9e9eb;
    --bg-content: #ffffff;
    --bg-card: #ffffff;
    --bg-control: #ffffff;
    --text-primary: #1d1d1f;
    --text-secondary: #636366;
    --text-tertiary: #636366;
    --hairline: rgba(0, 0, 0, 0.12);
    --hairline-card: rgba(0, 0, 0, 0.09);
    --control-border: #8e8e93;
    --accent: #0a84ff;
    --accent-fill: #0064d2;
    --switch-off: rgba(0, 0, 0, 0.17);
    --focus-ring: #0a84ff;
    --keycap-bg: linear-gradient(180deg, #ffffff, #eeeeef);
    --ok: #12733b;
    --err: #b42318;
    --danger-fill: #b42318;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-window: #1e1e1e;
    --bg-sidebar: #262629;
    --bg-bar: #262629;
    --bg-content: #1e1e1e;
    --bg-card: #2c2c2e;
    --bg-control: #3a3a3c;
    --text-primary: #f5f5f7;
    --text-secondary: #98989d;
    --text-tertiary: #8e8e93;
    --hairline: rgba(255, 255, 255, 0.13);
    --hairline-card: rgba(255, 255, 255, 0.1);
    --control-border: #8e8e93;
    --accent: #0a84ff;
    --accent-fill: #0064d2;
    --switch-off: rgba(255, 255, 255, 0.18);
    --focus-ring: #0a84ff;
    --keycap-bg: linear-gradient(180deg, #48484a, #3a3a3c);
    --ok: #34c07a;
    --err: #ff6b6b;
    --danger-fill: #c53030;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-window);
    color: var(--text-primary);
    font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  /* Error text and the config path are what a bug report needs: copyable. */
  input, textarea, #status, .config-path { -webkit-user-select: text; user-select: text; }

  .body { flex: 1; display: flex; min-height: 0; }

  /* sidebar */
  .sidebar {
    width: 180px; flex: none;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--hairline);
    display: flex; flex-direction: column;
  }
  .sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
  .nav-item {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 4px 8px; margin-bottom: 1px;
    border: none; border-radius: 6px; background: transparent;
    color: var(--text-primary);
    font-family: inherit; font-size: 13px; text-align: left; cursor: pointer;
  }
  .nav-item:hover { background: rgba(127, 127, 127, 0.12); }
  .nav-item.active, .nav-item.active:hover { background: var(--accent-fill); color: #fff; }
  .nav-item:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .nav-item.active:focus-visible { outline-color: var(--text-primary); }
  .nav-item.dim:not(.active) .nav-label { color: var(--text-secondary); }
  .nav-item.dim .icon-sq { opacity: 0.5; }
  .nav-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-sq {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35);
  }
  .icon-sq svg { width: 13px; height: 13px; }

  .sidebar-footer { flex: none; padding: 8px 12px 10px; border-top: 1px solid var(--hairline); }
  .version { font-size: 11px; color: var(--text-secondary); }
  .config-path {
    font-size: 10px; color: var(--text-tertiary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }

  /* content + panes */
  .content { flex: 1; overflow-y: auto; padding: 20px 24px 24px; background: var(--bg-content); }
  .pane h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .pane-note { font-size: 11.5px; color: var(--text-secondary); margin: 0 0 14px; line-height: 1.5; max-width: 460px; }
  .pane > h1 + .group, .pane > .pane-note + .group { margin-top: 14px; }
  .group { margin-bottom: 16px; }
  .caption { font-size: 11px; color: var(--text-secondary); margin: 0 0 6px 2px; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--hairline-card);
    border-radius: 10px;
    overflow: hidden;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 9px 12px; min-height: 20px;
  }
  .row + .row { border-top: 1px solid var(--hairline-card); }
  .row.stacked { flex-direction: column; align-items: stretch; }
  .row-text { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .row-label { font-size: 13px; color: var(--text-primary); }
  .row.invalid { box-shadow: inset 3px 0 0 var(--err); }
  .row.invalid .input, .row.invalid .keycap, .row.invalid select { border-color: var(--err); }
  .row-hint { font-size: 11px; color: var(--text-secondary); line-height: 1.4; }
  .row-control { flex: none; display: flex; align-items: center; gap: 8px; }
  .row.stacked .row-control { flex: 1 1 100%; flex-wrap: wrap; margin-top: 6px; }
  /* .dim greys out what does not apply while uploads are off; the inputs
     themselves are also really disabled by syncEnabledState(). */
  .dim { opacity: 0.42; }
  /* Rows the platform owns (gated): grey the label and control but keep the
     hint, which explains why, at full secondary contrast. */
  .row.gated .row-label, .row.gated .row-control { opacity: 0.42; }
  .hidden { display: none !important; }

  /* toggle switch */
  .switch { position: relative; width: 34px; height: 20px; flex: none; display: inline-block; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; background: var(--switch-off); border-radius: 999px; transition: background .15s ease; }
  .switch .thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .15s ease; }
  .switch input:checked ~ .track { background: var(--accent); }
  .switch input:checked ~ .track .thumb { transform: translateX(14px); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .switch input:disabled { cursor: default; }
  .switch input:disabled ~ .track { opacity: .55; }

  /* popup select */
  .popup { position: relative; display: inline-flex; align-items: center; }
  .popup select {
    appearance: none; -webkit-appearance: none;
    font-family: inherit; font-size: 12.5px;
    color: var(--text-primary); background: var(--bg-control);
    border: 1px solid var(--control-border); border-radius: 6px;
    padding: 4px 24px 4px 9px; min-width: 140px; max-width: 300px;
  }
  .popup select:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .popup .chevron {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 9px; height: 9px; pointer-events: none;
    fill: none; stroke: var(--text-secondary); stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .input {
    font-family: inherit; font-size: 12.5px;
    color: var(--text-primary); background: var(--bg-control);
    border: 1px solid var(--control-border); border-radius: 6px; padding: 5px 9px;
  }
  .input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .input.w-sm { width: 74px; }
  .input.w-lg { width: 250px; }
  input[type="color"].input { width: 48px; height: 28px; padding: 2px; }
  textarea.input {
    width: 100%; resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
  }

  .keycap {
    font-family: inherit; font-size: 12.5px; text-align: center;
    color: var(--text-primary); background: var(--keycap-bg);
    border: 1px solid var(--control-border); border-bottom-width: 2px;
    border-radius: 6px; padding: 5px 10px; width: 250px;
  }
  .keycap:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .keycap.recording { outline: 2px solid var(--focus-ring); outline-offset: 1px; border-style: dashed; }
  .keycap + [data-record] { margin-left: 6px; }

  .chip-check { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-primary); padding: 3px 6px 3px 0; }
  .chip-check input { accent-color: var(--accent); width: 13px; height: 13px; }

  .btn { font-family: inherit; font-size: 12.5px; padding: 6px 14px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
  .btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-accent { background: var(--accent-fill); color: #fff; }
  .btn-plain { background: var(--bg-control); border-color: var(--hairline); color: var(--text-primary); }
  .btn-subtle { background: transparent; border-color: transparent; color: var(--text-secondary); }
  .btn-sm { padding: 5px 10px; font-size: 12.5px; }
  .btn.danger { background: var(--danger-fill); border-color: transparent; color: #fff; }

  /* footer */
  footer {
    flex: none; min-height: 50px;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    background: var(--bg-bar);
    border-top: 1px solid var(--hairline);
  }
  #status {
    flex: 1; min-width: 0; font-size: 11.5px; line-height: 1.35;
    color: var(--text-secondary); white-space: pre-wrap;
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
</style>
<script type="module" src="/wails/runtime.js"></script>
</head>
<body>
<div class="body">
  <nav class="sidebar">
    <div class="sidebar-list" role="tablist" aria-orientation="vertical" aria-label="Settings sections" id="nav"></div>
    <div class="sidebar-footer">
      <div class="version" id="ver"></div>
      <div class="config-path" id="cfgpath"></div>
    </div>
  </nav>
  <main class="content" id="form"></main>
</div>
<footer>
  <div id="status" role="status" aria-live="polite"></div>
  <button type="button" id="reset" class="btn btn-subtle">Reset to defaults</button>
  <button type="button" id="discard" class="btn btn-plain">Discard changes</button>
  <button type="button" id="save" class="btn btn-accent">Save</button>
</footer>
<script>
"use strict";

// Declarative form schema. path = dot-path into the Config object (Go field
// names, since config.Config has no json tags). Special types "secret:*" map
// to the write-only SaveRequest fields. Each section also carries the sidebar
// glyph (raw inline SVG) and the tint of its rounded icon square.
// Editor tools: config value -> label shown here and in the editor toolbar.
const TOOLS = [
  { v: "crop", l: "Crop" }, { v: "arrow", l: "Arrow" }, { v: "rect", l: "Rectangle" },
  { v: "ellipse", l: "Ellipse" }, { v: "line", l: "Line" }, { v: "freehand", l: "Freehand" },
  { v: "text", l: "Text" }, { v: "blur", l: "Blur" }, { v: "pixelate", l: "Pixelate" },
  { v: "highlight", l: "Highlight" }, { v: "step", l: "Step" },
];
// gates: [LoadResult flag, hint] pairs; a field whose flag is false is
// shown greyed out with that hint instead of accepting an ignored edit.
const STORE_UPDATES = ["updaterAvailable", "the Microsoft Store installs updates for this copy"];

const SCHEMA = [
  { title: "Appearance", tint: "#8e8e93",
    icon: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#fff"/><path d="M12 4a8 8 0 000 16z" fill="rgba(0,0,0,.35)"/></svg>`,
    fields: [
    { p: "Theme", l: "Theme", t: "select", opts: [
      { v: "system", l: "Match the system" }, { v: "light", l: "Light" }, { v: "dark", l: "Dark" }] },
  ]},
  { title: "Startup", tint: "#ffd60a",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M7.4 6.6a7 7 0 109.2 0"/></svg>`,
    fields: [
    { p: "StartAtLogin", l: "Start at login", t: "bool", packagedOff: true,
      hint: "launch GoShareIt when you sign in",
      packagedHint: "managed by Windows on Microsoft Store installs: Settings > Apps > Startup > GoShareIt" },
  ]},
  { title: "Upload", tint: "#0a84ff",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16a4 4 0 01.5-7.9A5 5 0 0117 9a3.5 3.5 0 01-.5 7H7z"/><path d="M12 12v6M9.5 14.5L12 12l2.5 2.5"/></svg>`,
    fields: [
    { p: "Upload.Enabled", l: "Upload captures", t: "bool",
      hint: "off = captures stay on this computer and the server settings are not needed" },
    { p: "Upload.Destination", l: "Destination", t: "select",
      // Public host presets are appended at init() from the backend catalog.
      opts: [
        { group: "Your server" },
        { v: "nextcloud", l: "Nextcloud" },
        { v: "s3", l: "S3-compatible (AWS / B2 / MinIO / R2)" },
        { v: "sftp", l: "SFTP" },
        { v: "webdav", l: "WebDAV" },
        { v: "custom", l: "Custom HTTP (any endpoint)" },
      ],
      hint: "fields for the selected destination appear below" },
    { p: "Upload.DirectLink", l: "Copy the direct image link", t: "bool",
      hint: "on = the link opens the image itself; off = it opens the share page, where the destination has one" },
    { p: "Upload.AllowInsecureHTTP", l: "Allow insecure http:// server address", t: "bool",
      hint: "off = the server address must start with https:// (addresses on this computer or your home network are always allowed); on sends your password unencrypted" },
  ],
    // destPanels: one sub-panel per destination, all rendered in the DOM
    // inside a single inset .destpanel container; only the sub-panel that
    // matches Upload.Destination stays visible (see syncDestPanel()).
    destPanels: [
      { key: "nextcloud", label: "Nextcloud settings", fields: [
        { p: "Nextcloud.BaseURL",   l: "Server URL",   t: "text", hint: "https://cloud.example.com" },
        { p: "Nextcloud.Username",  l: "Username",     t: "text" },
        { p: "Nextcloud.DavUser",   l: "Storage user name", t: "text", hint: "only if it differs from the username; blank = worked out from it" },
        { p: "Nextcloud.RemoteDir", l: "Remote folder",t: "text", hint: "blank = files root" },
        { p: "@password",           l: "App password", t: "secret" },
        { p: "Upload.ShareExpireDays", l: "Share expiry (days)", t: "number", hint: "0 = never" },
        { p: "Upload.SharePassword",   l: "Share password", t: "text", hint: "blank = none" },
      ]},
      { key: "s3", label: "S3-compatible settings", fields: [
        { p: "S3.Endpoint",  l: "Endpoint", t: "text", hint: "host[:port], no scheme, e.g. s3.us-west-002.backblazeb2.com" },
        { p: "S3.Region",    l: "Region",   t: "text" },
        { p: "S3.Bucket",    l: "Bucket",   t: "text" },
        { p: "S3.AccessKey", l: "Access key", t: "text" },
        { p: "@s3_secret_key", l: "Secret key", t: "secret" },
        { p: "S3.Prefix",       l: "Key prefix",         t: "text", hint: "blank = bucket root" },
        { p: "S3.URLTemplate",  l: "Public URL template", t: "text", hint: "{bucket} {key} {name}; blank = a private link that expires (below)" },
        { p: "S3.UsePathStyle", l: "Bucket name in the path", t: "bool", hint: "needed by most providers other than AWS" },
        { p: "S3.PresignSeconds", l: "Private link lifetime (seconds)", t: "number", hint: "used when the public URL template is blank; up to 604800 (7 days), which is also the default" },
      ]},
      { key: "sftp", label: "SFTP settings", fields: [
        { p: "SFTP.Host", l: "Host", t: "text" },
        { p: "SFTP.Port", l: "Port", t: "number", hint: "default 22" },
        { p: "SFTP.User", l: "User", t: "text" },
        { p: "@sftp_password", l: "Password", t: "secret", hint: "used when no private key is set below" },
        { p: "SFTP.PrivateKeyFile", l: "Private key file", t: "text", hint: "path to a PEM file on this machine; takes precedence over password" },
        { p: "@sftp_passphrase", l: "Key passphrase", t: "secret", hint: "only needed if the private key above is encrypted" },
        { p: "SFTP.RemoteDir",   l: "Remote folder", t: "text" },
        { p: "SFTP.URLTemplate", l: "Public URL template", t: "text", hint: "{name}" },
        { p: "SFTP.HostKeyFingerprint", l: "Host key fingerprint", t: "text",
          hint: "SHA256:... (ssh-keygen -lf); blank leaves the host key unverified" },
      ]},
      { key: "webdav", label: "WebDAV settings", fields: [
        { p: "WebDAV.BaseURL",  l: "Server URL", t: "text", hint: "https://webdav.example.com/remote.php/dav/files/uploads" },
        { p: "WebDAV.Username", l: "Username", t: "text" },
        { p: "@webdav_password", l: "Password", t: "secret" },
        { p: "WebDAV.RemoteDir",   l: "Remote folder", t: "text" },
        { p: "WebDAV.URLTemplate", l: "Public URL template", t: "text", hint: "{name} {path}; blank = the PUT URL" },
      ]},
      // "host" serves every public host preset id (see syncDestPanel()).
      { key: "host", label: "Public host", fields: [
        { p: "@host_info",   l: "About this host", t: "info" },
        { p: "@host_secret", l: "API key / token", t: "secret", hint: "kept separately for each host, so switching hosts keeps every key" },
      ]},
      { key: "custom", label: "Custom HTTP settings", fields: [
        { p: "@custom_preset", l: "Start from a host preset", t: "preset", hint: "copies a public host's request into the editable fields below (pick the host directly in Destination if you do not need to change anything); still requires Save" },
        { p: "Custom.Method", l: "Method", t: "select", opts: ["POST", "PUT"] },
        { p: "Custom.URL",    l: "URL", t: "text", hint: "supports {name} {mime} {secret}" },
        { p: "Custom.Headers", l: "Headers", t: "kv", hint: "one key=value per line; values support {name} {mime} {secret} {secret:base64} {secret:basic}" },
        { p: "Custom.Body",      l: "Body", t: "select", opts: ["multipart", "raw"] },
        { p: "Custom.FileField", l: "File field", t: "text", hint: "multipart field name for the file; default \"file\"" },
        { p: "Custom.ExtraFields", l: "Extra fields", t: "kv",
          hint: "multipart only; one key=value per line; values support {name} {mime} {secret}" },
        { p: "@custom_secret", l: "Secret", t: "secret", hint: "API key or token; substitutes {secret} in the URL, headers and extra fields above" },
        { p: "Custom.ResponseURLPath",       l: "Response URL path",        t: "text", hint: "dot path into a JSON response, e.g. data.link" },
        { p: "Custom.ResponseDirectURLPath", l: "Response direct URL path", t: "text", hint: "blank = same as response URL" },
        { p: "Custom.ResponseDeleteURLPath", l: "Response delete URL path", t: "text", hint: "optional; the deletion link is kept in history" },
        { p: "Custom.ResponseURLRegex",      l: "Response URL regex",       t: "text", hint: "used instead of response URL path; first capture group is the URL; also feeds {regex} in templates" },

// SECRET_FIELDS maps a "@..." schema path to the LoadResult "has*" flag and
// the SaveRequest write-only field it collects into. @password is handled
// separately in render()/collect() because of the browser sign-in flow.
const SECRET_FIELDS = {
  "@password":        { has: "hasPassword",       saveKey: "newPassword" },
  "@s3_secret_key":   { has: "hasS3SecretKey",     saveKey: "newS3SecretKey" },
  "@sftp_password":   { has: "hasSFTPPassword",    saveKey: "newSFTPPassword" },
  "@sftp_passphrase": { has: "hasSFTPPassphrase",  saveKey: "newSFTPPassphrase" },
  "@webdav_password": { has: "hasWebDAVPassword",  saveKey: "newWebDAVPassword" },
  "@custom_secret":   { has: "hasCustomSecret",    saveKey: "newCustomSecret" },
  "@host_secret":     { has: "hasHostSecret",      saveKey: "newHostSecret" },
};

// secretEnvVar returns the *_env value that sources a "@..." secret field
// ("" if it is file-sourced or has no env option).
function secretEnvVar(p) {
  switch (p) {
    case "@password":        return model.config.Nextcloud.PasswordEnv || "";
    case "@s3_secret_key":   return model.config.S3.SecretKeyEnv || "";
    case "@sftp_password":   return model.config.SFTP.PasswordEnv || "";
    case "@sftp_passphrase": return model.config.SFTP.PassphraseEnv || "";
    case "@webdav_password": return model.config.WebDAV.PasswordEnv || "";
    case "@custom_secret":   return model.config.Custom.SecretEnv || "";
    case "@host_secret": {
      const dest = model.config.Upload.Destination;
      return ((model.config.Hosts || {})[dest] || {}).SecretEnv || "";
    }
    default:                 return "";
  }
}

const $ = (id) => document.getElementById(id);
let model = null;
let presets = {}; // custom-uploader presets, loaded from the backend at init
let pendingLoginPassword = ""; // minted by browser sign-in, applied on Save
let activePane = 0; // sidebar selection, preserved across re-renders

const CHEVRON = `<svg class="chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>`;

function kvToText(obj) {
  return Object.entries(obj || {}).map(([k, v]) => `${k}=${v}`).join("\n");
}
function textToKv(text) {
  const out = {};
  for (const line of text.split("\n")) {
    const t = line.trim();
    if (!t) continue;
    const i = t.indexOf("=");
    if (i < 0) continue;
    out[t.slice(0, i).trim()] = t.slice(i + 1);
  }
  return out;
}

const get = (obj, path) => path.split(".").reduce((o, k) => (o ? o[k] : undefined), obj);
const set = (obj, path, v) => {
  const keys = path.split("."); const last = keys.pop();
  keys.reduce((o, k) => (o[k] ??= {}), obj)[last] = v;
};

function fieldId(p) { return "f_" + p.replace(/[.@]/g, "_"); }

// paneId maps a section title to its pane element id; the sidebar button
// points at the same id via data-pane.
function paneId(title) { return "pane_" + title.replace(/[^a-z0-9]+/gi, "_").toLowerCase(); }

// allFields flattens a SCHEMA section into its plain fields plus (if present)
// every destPanels sub-panel's fields and tailFields, in DOM order. Used by
// collect() so every rendered input - visible or hidden behind the
// destination swap or the pane switch - is still read back.
function allFields(sec) {
  const out = [...sec.fields];
  if (sec.destPanels) for (const panel of sec.destPanels) out.push(...panel.fields);
  if (sec.tailFields) out.push(...sec.tailFields);
  return out;
}

// renderFieldRow builds one .row element for a schema field. Shared by the
// top-level section loop and the destPanels sub-panel loop in render().
function renderFieldRow(f) {
  const cfg = model.config;
  const row = document.createElement("div");
  const id = fieldId(f.p);
  row.dataset.row = id;
  // OS-specific fields stay in the DOM (collect() reads every input) but are
  // hidden on other platforms.
  if (f.os && model.os && f.os !== model.os) row.style.display = "none";
  // Settings the packaging system or this platform owns are shown greyed
  // out (with the reason as the hint) rather than accepted and then silently
  // ignored by the host.
  let gateHint = "";
  if (f.packagedOff && model.packaged) gateHint = f.packagedHint || f.hint;
  for (const [flag, why] of (f.gates || [])) {
    if (!gateHint && model[flag] === false) gateHint = why;
  }
  const gated = !!gateHint;
  let stacked = false;
  let control = "";
  const val = f.p.startsWith("@") ? "" : get(cfg, f.p);
  if (f.t === "text") {
    // Hotkeys read as key combinations, so they get the keycap treatment.
    const hk = f.p.startsWith("Hotkeys.");
    const cls = hk ? "keycap" : "input w-lg";
    control = `<input type="text" class="${cls}" id="${id}" value="${esc(val ?? "")}">` +
      (hk ? `<button type="button" class="btn btn-plain btn-sm" data-record="${id}" title="Press a key combination to fill this field">Record</button>` : "");
  } else if (f.t === "dir") {
    control = `<input type="text" class="input w-lg" id="${id}" value="${esc(val ?? "")}">` +
      `<button type="button" class="btn btn-plain btn-sm" data-browse="${id}">Browse...</button>`;
  } else if (f.t === "color") {
    const c = /^#[0-9a-f]{6}$/i.test(val || "") ? val : "#ff3b30";
    control = `<input type="color" class="input" id="${id}" value="${esc(c)}">`;
  } else if (f.t === "number") {
    control = `<input type="number" class="input w-sm" id="${id}" min="0"${f.max ? ` max="${f.max}"` : ""} step="1" value="${Number(val ?? 0)}">`;
  } else if (f.t === "bool") {
    // *bool fields default to true when null. The checkbox is a real input
    // inside the switch, so every id/checked path keeps working.
    const defaultTrue = f.p === "Update.Enabled" || f.p === "Upload.Enabled";
    const on = defaultTrue ? (val !== false) : !!val;
    control = `<label class="switch"><input type="checkbox" id="${id}" ${on ? "checked" : ""}>` +
      `<span class="track"><span class="thumb"></span></span></label>`;
  } else if (f.t === "select") {
    // opts entries are either a plain string (value === label) or
    // { v, l } when the displayed label needs to differ from the enum value.
    // { group } entries open an <optgroup> for the entries that follow.
    let openGroup = false;
    control = `<span class="popup"><select id="${id}">` + f.opts.map(o => {
      if (typeof o === "object" && o.group) {
        const s = (openGroup ? "</optgroup>" : "") + `<optgroup label="${esc(o.group)}">`;
        openGroup = true;
        return s;
      }
      const v = (typeof o === "object") ? o.v : o;
      const l = (typeof o === "object") ? o.l : o;
      return `<option value="${esc(v)}" ${v === val ? "selected" : ""}>${esc(l)}</option>`;
    }).join("") + (openGroup ? "</optgroup>" : "") + `</select>${CHEVRON}</span>`;
  } else if (f.t === "checks") {
    stacked = true;
    const cur = new Set(val || []);
    control = `<div role="group" aria-labelledby="${id}_label">` + f.opts.map(o => {
      const v = (typeof o === "object") ? o.v : o;
      const l = (typeof o === "object") ? o.l : o;
      return `<label class="chip-check"><input type="checkbox" data-group="${id}" value="${esc(v)}" ${cur.has(v) ? "checked" : ""}>${esc(l)}</label>`;
    }).join("") + `</div>`;
  } else if (f.t === "kv") {
    stacked = true;
    control = `<textarea class="input" id="${id}" rows="3">${esc(kvToText(val))}</textarea>`;
  } else if (f.t === "info") {
    stacked = true;
    control = `<div class="row-hint" id="${id}"></div>`;
  } else if (f.t === "preset") {
    const keys = Object.keys(presets).sort((a, b) => (presets[a].Label || a).localeCompare(presets[b].Label || b));
    control = `<span class="popup"><select id="${id}"><option value="">(choose a host)</option>` +
      keys.map(k => `<option value="${k}">${esc(presets[k].Label || k)}</option>`).join("") + `</select>${CHEVRON}</span>` +
      `<button type="button" class="btn btn-plain btn-sm" id="btn_apply_preset" disabled>Apply preset</button>` +
      `<div class="row-hint" id="preset_help"></div>`;
  } else if (f.t === "secret") {
    const envVar = secretEnvVar(f.p);
    if (envVar) {
      // Env-sourced secrets are read-only here; Save() rejects file writes.
      // data-locked keeps syncEnabledState() from re-enabling it.
      control = `<input type="password" class="input w-lg" id="${id}" disabled data-locked="1" placeholder="(set by the environment variable ${esc(envVar)})">`;
    } else {
      const has = model[SECRET_FIELDS[f.p].has];
      control = `<input type="password" class="input w-lg" id="${id}" placeholder="${has ? "(unchanged)" : "not set - enter to configure"}">`;
      if (f.p === "@password") {
        // Browser sign-in (Login Flow v2): the server-side auth - incl.
        // OIDC/SSO - happens in the browser; we receive an app password.
        control += `<button type="button" class="btn btn-plain btn-sm" id="btn_login">Sign in with browser</button>`;
      }
    }
  }
  row.className = stacked ? "row stacked" : "row";
  const hint = gated ? gateHint : f.hint;
  // A real <label for> names text boxes, switches, selects and secrets for
  // screen readers; checks groups point at it via aria-labelledby.
  const labelTag = (f.t === "checks" || f.t === "info") ? "div" : "label";
  row.innerHTML = `<div class="row-text"><${labelTag} class="row-label" id="${id}_label"${labelTag === "label" ? ` for="${id}"` : ""}>${esc(f.l)}</${labelTag}>` +
    (hint ? `<div class="row-hint" id="${id}_hint">${esc(hint)}</div>` : "") + `</div>` +
    `<div class="row-control">${control}</div>`;
  const ctl = row.querySelector("#" + id);
  if (ctl && hint) ctl.setAttribute("aria-describedby", id + "_hint");
  if (gated) {
    row.classList.add("gated");
    row.querySelectorAll("input, select, textarea, button").forEach((el) => {
      el.disabled = true;
      el.dataset.locked = "1";
    });
  }
  return row;
}

// card builds a grouped inset card (hairline-separated rows) from a field
// list, optionally preceded by a small caption.
function card(fields, caption) {
  const group = document.createElement("div");
  group.className = "group";
  if (caption) {
    const c = document.createElement("div");
    c.className = "caption";
    c.textContent = caption;
    group.appendChild(c);
  }
  const box = document.createElement("div");
  box.className = "card";
  for (const f of fields) box.appendChild(renderFieldRow(f));
  group.appendChild(box);
  return group;
}

function render() {
  const nav = $("nav");
  const root = $("form");
  nav.innerHTML = "";
  root.innerHTML = "";
  for (const sec of SCHEMA) {
    const id = paneId(sec.title);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "nav-item";
    btn.id = "tab_" + id;
    btn.dataset.pane = id;
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-controls", id);
    btn.innerHTML = `<span class="icon-sq" style="background:${sec.tint}" aria-hidden="true">${sec.icon}</span>` +
      `<span class="nav-label">${esc(sec.title)}</span>`;
    nav.appendChild(btn);

    // Every pane stays in the DOM (hidden via .hidden) so collect() can read
    // every input regardless of which pane is on screen.
    const s = document.createElement("section");
    s.className = "pane";
    s.id = id;
    s.dataset.section = sec.title;
    s.setAttribute("role", "tabpanel");
    s.setAttribute("aria-labelledby", "tab_" + id);
    const note = typeof sec.note === "function" ? sec.note(model.os) : sec.note;
    s.innerHTML = `<h1>${esc(sec.title)}</h1>` + (note ? `<p class="pane-note">${esc(note)}</p>` : "");
    s.appendChild(card(sec.fields));
    if (sec.destPanels) {
      // One container; each destination gets its own always-rendered card so
      // collect() keeps reading every input. syncDestPanel() toggles which
      // one is visible.
      const dp = document.createElement("div");
      dp.id = "destpanel";
      for (const panel of sec.destPanels) {
        const sub = card(panel.fields, panel.label);
        sub.id = "destpanel_" + panel.key;
        dp.appendChild(sub);
      }
      s.appendChild(dp);
    }
    if (sec.tailFields) {
      const tail = card(sec.tailFields);
      tail.id = "tailgroup";
      s.appendChild(tail);
    }
    root.appendChild(s);
  }
  $("cfgpath").textContent = model.configPath;
  $("cfgpath").title = model.configPath;
  $("ver").textContent = "v" + model.version;
  selectPane(activePane);
  syncDestPanel();
  syncEnabledState();
  syncDefaultTool();
}

// selectPane shows exactly one pane and marks the matching sidebar item.
// Only the selected tab is in the Tab order (roving tabindex); arrow keys
// move between tabs (see the #nav keydown handler).
function selectPane(i, focus) {
  const items = [...document.querySelectorAll(".nav-item")];
  if (i < 0 || i >= items.length) i = 0;
  activePane = i;
  items.forEach((b, n) => {
    b.classList.toggle("active", n === i);
    b.setAttribute("aria-selected", n === i ? "true" : "false");
    b.tabIndex = n === i ? 0 : -1;
  });
  if (focus && items[i]) items[i].focus();
  const target = items[i] ? items[i].dataset.pane : "";
  document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("hidden", p.id !== target));
}

// syncDestPanel shows only the destPanels sub-panel matching the current
// Upload.Destination value; the rest get the .hidden class. All sub-panels
// stay in the DOM regardless, so collect() always has something to read.
function syncDestPanel() {
  const upload = SCHEMA.find((sec) => sec.destPanels);
  if (!upload) return;
  const destSel = $(fieldId("Upload.Destination"));
  const dest = destSel ? destSel.value : "";
  const isHost = !!presets[dest];
  for (const panel of upload.destPanels) {
    const el = $("destpanel_" + panel.key);
    if (el) el.classList.toggle("hidden", panel.key === "host" ? !isHost : panel.key !== dest);
  }
  if (isHost) syncHostPanel(dest);
}

// syncHostPanel fills the public-host panel for dest: the host's notes and
// whether a key is already stored for it (keys are per host, so the
// placeholder follows the selection, not just the loaded destination).
function syncHostPanel(dest) {
  const p = presets[dest];
  const info = $(fieldId("@host_info"));
  if (info && p) {
    const parts = [];
    if (p.Kinds) parts.push("Accepts: " + p.Kinds + ".");
    if (p.Secret) parts.push("Key: " + p.Secret + (p.SecretOptional ? " (optional)." : " (required)."));
    else parts.push("No account or key needed.");
    if (p.Help) parts.push(p.Help);
    info.textContent = parts.join(" ");
  }
  const key = $(fieldId("@host_secret"));
  if (key && !key.dataset.locked) {
    // The key is per host: a value typed for the previous host must not be
    // saved under this one.
    if (key.dataset.host !== dest) { key.value = ""; key.dataset.host = dest; }
    const has = !!((model.hostSecrets || {})[dest]);
    key.placeholder = has ? "(unchanged)" : (p && !p.Secret ? "not needed for this host" : "not set - enter to configure");
    key.disabled = !!(p && !p.Secret);
  }
}

// syncEnabledState greys out everything that does not apply when uploads are
// off (local-only mode): the destination select, the whole destination
// panel, and After upload (rows plus its sidebar item, which stays
// clickable). The file name and the notification setting live under After
// capture because they apply to local copies too. Which destination
// sub-panel is visible is handled separately by syncDestPanel().
function syncEnabledState() {
  const uploadsBox = $(fieldId("Upload.Enabled"));
  if (!uploadsBox) return;
  const uploadsOn = uploadsBox.checked;
  const destSel = $(fieldId("Upload.Destination"));
  if (destSel) destSel.disabled = !uploadsOn;
  const destRow = document.querySelector(`[data-row="${fieldId("Upload.Destination")}"]`);
  if (destRow) destRow.classList.toggle("dim", !uploadsOn);
  const panel = $("destpanel");
  if (panel) {
    panel.classList.toggle("dim", !uploadsOn);
    panel.querySelectorAll("input, select, textarea, button")
      .forEach((el) => { if (!el.dataset.locked) el.disabled = !uploadsOn; });
  }
  document.querySelectorAll(`[data-section="After upload"] input, [data-section="After upload"] select, [data-section="After upload"] button`)
    .forEach((el) => { el.disabled = !uploadsOn; });
  document.querySelectorAll(`[data-section="After upload"] .card`)
    .forEach((el) => el.classList.toggle("dim", !uploadsOn));
  const navItem = document.querySelector(`.nav-item[data-pane="${paneId("After upload")}"]`);
  if (navItem) navItem.classList.toggle("dim", !uploadsOn);
  if (uploadsOn) syncDestPanel(); // re-applies per-host input state
  syncPresetButton();
}

// syncPresetButton enables "Apply preset" only once a host is chosen.
function syncPresetButton() {
  const btn = $("btn_apply_preset");
  const sel = $(fieldId("@custom_preset"));
  if (btn && sel) btn.disabled = sel.disabled || !sel.value;
}

// syncDefaultTool limits the Default tool choices to the checked Tools, and
// moves the selection to the first checked tool when its tool was unchecked.
function syncDefaultTool() {
  const sel = $(fieldId("Editor.DefaultTool"));
  if (!sel) return;
  const checked = [...document.querySelectorAll(`input[data-group="${fieldId("Editor.Tools")}"]:checked`)].map((x) => x.value);
  const allowed = checked.length ? checked : TOOLS.map((t) => t.v); // none checked = the editor shows all
  const cur = sel.value;
  sel.innerHTML = TOOLS.filter((t) => allowed.includes(t.v))
    .map((t) => `<option value="${esc(t.v)}">${esc(t.l)}</option>`).join("");
  sel.value = allowed.includes(cur) ? cur : allowed[0];
}

function collect() {
  const cfg = model.config;
  let newPassword = "";
  const secrets = { newS3SecretKey: "", newSFTPPassword: "", newSFTPPassphrase: "", newWebDAVPassword: "", newCustomSecret: "" };
  for (const sec of SCHEMA) {
    for (const f of allFields(sec)) {
      const id = fieldId(f.p);
      if (f.t === "preset" || f.t === "info") continue; // UI-only, not part of the config
      if (f.t === "secret") {
        const v = $(id).value;
        if (f.p === "@password") {
          // Manual entry wins; otherwise a pending browser sign-in applies.
          newPassword = v || pendingLoginPassword || "";
        } else {
          secrets[SECRET_FIELDS[f.p].saveKey] = v;
        }
        continue;
      }
      if (f.t === "checks") {
        const vals = [...document.querySelectorAll(`input[data-group="${id}"]:checked`)].map(x => x.value);
        set(cfg, f.p, vals);
      } else if (f.t === "bool") {
        set(cfg, f.p, $(id).checked);
      } else if (f.t === "number") {
        // Clamp to a non-negative integer: Go int fields reject floats at the
        // JSON bridge, and the config validator rejects negatives.
        let n = Math.max(0, Math.round(Number($(id).value) || 0));
        if (f.max) n = Math.min(n, f.max);
        set(cfg, f.p, n);
      } else if (f.t === "kv") {
        set(cfg, f.p, textToKv($(id).value));
      } else {
        set(cfg, f.p, $(id).value);
      }
    }
  }
  return { config: cfg, newPassword, ...secrets };
}

// applyTheme stamps data-theme on <html> so the CSS overrides above take
// effect: "light"/"dark" force that theme, anything else (empty/"system")
// clears the attribute and lets prefers-color-scheme decide.
function applyTheme(theme) {
  const t = (theme === "light" || theme === "dark") ? theme : "";
  document.documentElement.setAttribute("data-theme", t);
}

// applyPreset fills the Custom section's inputs from a built-in preset
// (imgur/catbox/0x0). Client-side only - nothing is saved until the user
// clicks Save.
function applyPreset(key) {
  const p = presets[key];
  if (!p) return;
  $(fieldId("Custom.Method")).value = p.Method || "POST";
  $(fieldId("Custom.URL")).value = p.URL || "";
  $(fieldId("Custom.Headers")).value = kvToText(p.Headers);
  $(fieldId("Custom.Body")).value = p.Body || "multipart";
  $(fieldId("Custom.FileField")).value = p.FileField || "";
  $(fieldId("Custom.ExtraFields")).value = kvToText(p.ExtraFields);
  $(fieldId("Custom.ResponseURLPath")).value = p.ResponseURLPath || "";
  $(fieldId("Custom.ResponseDirectURLPath")).value = p.ResponseDirectURLPath || "";
  $(fieldId("Custom.ResponseDeleteURLPath")).value = p.ResponseDeleteURLPath || "";
  $(fieldId("Custom.ResponseURLRegex")).value = p.ResponseURLRegex || "";
  $(fieldId("Custom.ResponseURLTemplate")).value = p.ResponseURLTemplate || "";
  $(fieldId("Custom.ResponseDirectURLTemplate")).value = p.ResponseDirectURLTemplate || "";
  $(fieldId("Custom.ResponseDeleteURLTemplate")).value = p.ResponseDeleteURLTemplate || "";
  let msg = `${p.Label || key} applied to the Custom HTTP panel - review, then Save.`;
  if (p.Secret && !p.SecretOptional) msg += ` Paste your ${p.Secret} into the Secret field.`;
  status(msg, "ok");
}

// presetHelp shows the chosen host's notes (what it takes, what the secret
// is, where to get it) under the picker before anything is applied.
function presetHelp(key) {
  const el = $("preset_help");
  if (!el) return;
  const p = presets[key];
  if (!p) { el.textContent = ""; return; }
  const parts = [];
  if (p.Kinds) parts.push("Accepts: " + p.Kinds + ".");
  if (p.Secret) parts.push("Secret: " + p.Secret + (p.SecretOptional ? " (optional)." : " (required)."));
  else parts.push("No account or key needed.");
  if (p.Help) parts.push(p.Help);
  el.textContent = parts.join(" ");
}

document.addEventListener("change", (e) => {
  if (e.target.id === fieldId("@custom_preset")) presetHelp(e.target.value);
});

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

// status writes the footer message. Errors are announced as alerts, the rest
// politely. owner tags a message so the flow that wrote it can clear it when
// it ends (statusOwner), instead of leaving a stale instruction behind.
let statusOwner = "";
function status(msg, cls, owner) {
  const el = $("status");
  el.textContent = msg;
  el.className = cls || "";
  el.setAttribute("role", cls === "err" ? "alert" : "status");
  statusOwner = owner || "";
}
function clearStatus(owner) { if (statusOwner === owner) status("", ""); }

// findField returns the schema field for a path ("Nextcloud.BaseURL").
function findField(path) {
  for (const sec of SCHEMA) for (const f of allFields(sec)) if (f.p === path) return f;
  return null;
}

// focusField switches to the pane holding path's input, focuses it and marks
// its row until the next edit.
function focusField(path) {
  const el = $(fieldId(path));
  if (!el) return;
  const pane = el.closest(".pane");
  const items = [...document.querySelectorAll(".nav-item")];
  const i = items.findIndex((b) => pane && b.dataset.pane === pane.id);
  if (i >= 0) selectPane(i);
  const row = el.closest(".row");
  if (row) row.classList.add("invalid");
  el.focus();
}

// errorText turns a rejected backend call into plain text. A SaveError
// carries the field and a plain problem ("is required"), shown after the
// field's own label and pointed at; anything else loses its Go package
// prefix ("settings: ", "config: ").
function errorText(e, prefix) {
  const c = e && e.cause;
  if (c && typeof c === "object") {
    const f = c.field ? findField(c.field) : null;
    if (f && c.problem) {
      focusField(c.field);
      return `${prefix}${f.l} ${c.problem}.`;
    }
    if (c.message) return c.message;
  }
  const msg = String((e && e.message) || e).replace(/^(\w+: )+/, "");
  return prefix + msg.charAt(0).toUpperCase() + msg.slice(1);
}

// Wails v3 bound-method shim. Methods are addressed by fully qualified Go
// name (import path + type + method); the prefix lives here ONLY so a
// package move cannot silently break scattered call sites.
const SERVICE_FQN = "github.com/Rake-Pro/GoShareIt/internal/settings.Service";
const SERVICE_METHODS = ["Load", "Save", "Presets", "PickDirectory", "ResetDefaults", "BrowserLogin", "CancelLogin", "CloseWindow", "SetDirty"];
function svc() {
  const call = globalThis.wails && globalThis.wails.Call && globalThis.wails.Call.ByName;
  if (!call) return null;
  const s = {};
  for (const m of SERVICE_METHODS) s[m] = (...args) => call(SERVICE_FQN + "." + m, ...args);
  return s;
}

// Unsaved-edits tracking: baseline is the form as loaded; any difference
// (including a typed secret or a pending browser sign-in) is "dirty", which
// the backend uses to hold back the first window close.
let baseline = "";
let lastDirty = false;
function syncDirty() {
  if (!model) return;
  const dirty = JSON.stringify(collect()) !== baseline;
  if (dirty !== lastDirty) {
    lastDirty = dirty;
    svc().SetDirty(dirty).catch(() => {});
  }
}

async function init() {
  if (!svc()) { status("Settings could not start. Close this window and open Settings from the tray again.", "err"); return; }
  try {
    presets = await svc().Presets();
    // Public hosts become first-class destinations, grouped after the
    // self-hosted options; the Custom HTTP panel keeps its own preset picker.
    const destField = SCHEMA.find((sec) => sec.destPanels).fields.find((f) => f.p === "Upload.Destination");
    if (destField && !destField.opts.some((o) => o.group === "Public hosts")) {
      destField.opts.push({ group: "Public hosts" });
      Object.keys(presets)
        .sort((a, b) => (presets[a].Label || a).localeCompare(presets[b].Label || b))
        .forEach((k) => destField.opts.push({ v: k, l: (presets[k].Label || k) + (presets[k].Kinds ? " - " + presets[k].Kinds : "") }));
    }
    model = await svc().Load();
    render();
    applyTheme(model.config.Theme);
    baseline = JSON.stringify(collect());
    globalThis.wails.Events.On("settings:unsaved-close", () => {
      armDiscard();
      status("You have unsaved changes. Click Save to keep them, or close the window again to discard them.", "err", "discard");
    });
  } catch (e) {
    status(errorText(e, "Settings could not be loaded: "), "err");
  }
}

// Sidebar routing. The buttons are rebuilt by render(), so the listener sits
// on the list container.
$("nav").addEventListener("click", (e) => {
  const btn = e.target.closest(".nav-item");
  if (!btn) return;
  selectPane([...document.querySelectorAll(".nav-item")].indexOf(btn));
});
$("nav").addEventListener("keydown", (e) => {
  const n = document.querySelectorAll(".nav-item").length;
  const next = { ArrowDown: activePane + 1, ArrowUp: activePane - 1, Home: 0, End: n - 1 }[e.key];
  if (next === undefined) return;
  e.preventDefault();
  selectPane((next + n) % n, true);
});

$("save").addEventListener("click", async () => {
  if (!model) return;
  $("save").disabled = true;
  status("Saving...");
  try {
    await svc().Save(collect());
    pendingLoginPassword = "";
    // Auto-close on success: the host blocks on this window and applies the
    // saved config (restarting itself) as soon as it exits, so closing here
    // is what makes Save take effect without further user action. The short
    // delay lets the confirmation register before the window disappears.
    status("Saved - applying...", "ok");
    setTimeout(() => {
      svc().CloseWindow().catch(() => {
        status("Saved. Close this window to apply.", "ok");
        $("save").disabled = false;
      });
    }, 600);
  } catch (e) {
    status(errorText(e, "Not saved: "), "err");
    $("save").disabled = false;
  }
});

// Discard changes: close without saving. The helper exits 0 (no ExitSaved),
// so the host discards - same as closing the window by hand, but explicit.
// With unsaved edits it asks once first (two-step, like Reset).
let discardArmed = 0;
function armDiscard() {
  const now = Date.now();
  discardArmed = now;
  $("discard").classList.add("danger");
  $("discard").textContent = "Confirm discard";
  setTimeout(() => { if (discardArmed === now) disarmDiscard(); }, 6000);
}
function disarmDiscard() {
  discardArmed = 0;
  $("discard").classList.remove("danger");
  $("discard").textContent = "Discard changes";
  clearStatus("discard");
}
$("discard").addEventListener("click", () => {
  syncDirty();
  if (lastDirty && !discardArmed) {
    armDiscard();
    status("Your unsaved changes will be lost. Click Confirm discard to close without saving.", "err", "discard");
    return;
  }
  svc().CloseWindow().catch(() => status("Close this window to discard your changes.", ""));
});

$("form").addEventListener("change", (e) => {
  if (e.target.id === fieldId("Upload.Enabled")) syncEnabledState();
  if (e.target.id === fieldId("Upload.Destination")) syncDestPanel();
  if (e.target.id === fieldId("Theme")) applyTheme(e.target.value);
  if (e.target.id === fieldId("@custom_preset")) syncPresetButton();
  if (e.target.dataset.group === fieldId("Editor.Tools")) syncDefaultTool();
  syncDirty();
});
$("form").addEventListener("input", (e) => {
  const row = e.target.closest(".row.invalid");
  if (row) row.classList.remove("invalid");
  syncDirty();
});

// Delegated clicks for per-row buttons (rows re-render, this listener does not).
// Hotkey recorder: "Record" arms the next key chord and writes it into the
// field in the host parser's token format (Ctrl/Cmd/Win/Alt/Shift + key).
// Esc cancels, Backspace/Delete with no modifiers clears the field.
let recording = null; // { input, btn, label }
const CODE_TOKENS = {
  Space: "Space", PrintScreen: "PrintScreen", Backquote: "`", Minus: "-", Equal: "=",
  BracketLeft: "[", BracketRight: "]", Semicolon: ";", Quote: "'", Comma: ",",
  Period: ".", Slash: "/", Backslash: "\\",
};
function chordToken(e) {
  const c = e.code || "";
  let m;
  if ((m = /^Key([A-Z])$/.exec(c))) return m[1];
  if ((m = /^Digit([0-9])$/.exec(c))) return m[1];
  if ((m = /^(F[1-9]|F1[0-9]|F20)$/.exec(c))) return m[1];
  return CODE_TOKENS[c] || null;
}
// chordFromEvent returns { chord } for a usable key combination, or
// { error } with a plain reason why this one cannot be a global hotkey.
function chordFromEvent(e) {
  const mac = model.os === "darwin";
  const mods = [];
  if (e.ctrlKey) mods.push("Ctrl");
  if (e.metaKey) mods.push(mac ? "Cmd" : "Win");
  if (e.altKey) mods.push(mac ? "Option" : "Alt");
  if (e.shiftKey) mods.push("Shift");
  const key = chordToken(e);
  if (!key) {
    return { error: mods.length ? "That key cannot be used for a global hotkey. Try a letter, digit or F-key."
      : "Add a modifier (Ctrl/Cmd/Alt/Shift) or use an F-key" + (model.os === "linux" ? "." : " or PrintScreen.") };
  }
  if (key === "PrintScreen" && model.os === "linux") {
    return { error: "PrintScreen cannot be used as a hotkey on Linux. Pick another key combination." };
  }
  // Bare letters/digits/punctuation would swallow normal typing system-wide;
  // F-keys and PrintScreen are fine on their own.
  if (!mods.length && !/^(F\d+|PrintScreen)$/.test(key)) {
    return { error: "Add a modifier (Ctrl/Cmd/Alt/Shift) or use an F-key" + (model.os === "linux" ? "." : " or PrintScreen.") };
  }
  return { chord: [...mods, key].join("+") };
}
// The button keeps its "Record" label (no layout shift); the dashed keycap
// and the status line say that recording is on.
function stopRecording() {
  if (!recording) return;
  recording.btn.setAttribute("aria-pressed", "false");
  recording.input.classList.remove("recording");
  recording = null;
  clearStatus("record");
}
function startRecording(btn) {
  stopRecording();
  const input = $(btn.dataset.record);
  recording = { input, btn };
  btn.setAttribute("aria-pressed", "true");
  input.classList.add("recording");
  input.focus();
  status("Press the key combination now. Esc cancels, Backspace clears the hotkey.", "", "record");
}
function onRecordKey(e) {
  if (!recording) return;
  // PrintScreen only reports keyup on Windows; everything else on keydown.
  if (e.type === "keyup" && e.code !== "PrintScreen") return;
  if (e.type === "keydown" && e.code === "PrintScreen") { e.preventDefault(); return; }
  e.preventDefault(); e.stopPropagation();
  if (["Control", "Shift", "Alt", "Meta"].includes(e.key)) return;
  if (e.key === "Escape") { stopRecording(); return; }
  if ((e.key === "Backspace" || e.key === "Delete") && !e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey) {
    recording.input.value = ""; stopRecording(); syncDirty(); return;
  }
  const res = chordFromEvent(e);
  if (res.error) { status(res.error, "err", "record"); return; }
  recording.input.value = res.chord;
  stopRecording();
  syncDirty();
}
document.addEventListener("keydown", onRecordKey, true);
document.addEventListener("keyup", onRecordKey, true);
document.addEventListener("mousedown", (e) => {
  if (recording && !e.target.closest("[data-record]")) stopRecording();
}, true);

$("form").addEventListener("click", async (e) => {
  const rec = e.target.closest("[data-record]");
  if (rec) { if (recording && recording.btn === rec) stopRecording(); else startRecording(rec); return; }
  const browse = e.target.closest("[data-browse]");
  if (browse) {
    try {
      const dir = await svc().PickDirectory();
      if (dir) { $(browse.dataset.browse).value = dir; syncDirty(); }
    } catch (err) { status(errorText(err, ""), "err"); }
    return;
  }
  if (e.target.id === "btn_apply_preset") {
    const key = $(fieldId("@custom_preset")).value;
    if (!key) return;
    applyPreset(key);
    syncDirty();
    return;
  }
  if (e.target.id === "btn_login") {
    const btn = e.target;
    // While the sign-in waits, the same button cancels it.
    if (loginRunning) { svc().CancelLogin().catch(() => {}); return; }
    const base = $(fieldId("Nextcloud.BaseURL")).value;
    const insecure = $(fieldId("Upload.AllowInsecureHTTP")).checked;
    loginRunning = true;
    btn.textContent = "Cancel sign-in";
    status("Complete the sign-in in your browser (waits up to 5 minutes)...", "", "login");
    try {
      const res = await svc().BrowserLogin(base, insecure);
      $(fieldId("Nextcloud.Username")).value = res.loginName;
      pendingLoginPassword = res.appPassword;
      status("Signed in as " + res.loginName + " - nothing is stored until you Save.", "ok");
      syncDirty();
    } catch (err) {
      const msg = String((err && err.message) || err);
      if (/cancelled/.test(msg)) status("Sign-in cancelled.", "", "login");
      else status(errorText(err, "Sign-in failed: "), "err");
    } finally {
      loginRunning = false;
      btn.textContent = "Sign in with browser";
    }
  }
});
let loginRunning = false;

// Reset to defaults: two-step confirm, and nothing is applied until Save.
let resetArmed = 0;
function disarmReset() {
  resetArmed = 0;
  const b = $("reset");
  b.classList.remove("danger");
  b.textContent = "Reset to defaults";
  clearStatus("reset");
}
$("reset").addEventListener("click", async () => {
  const now = Date.now();
  if (!resetArmed || now - resetArmed > 6000) {
    resetArmed = now;
    $("reset").classList.add("danger");
    $("reset").textContent = "Confirm reset";
    status("This replaces ALL settings with factory defaults (saved passwords and keys are kept). Click again to confirm - nothing is applied until you Save.", "err", "reset");
    setTimeout(() => { if (resetArmed === now) disarmReset(); }, 6000);
    return;
  }
  disarmReset();
  pendingLoginPassword = "";
  try {
    const res = await svc().ResetDefaults();
    model = res;
    render();
    applyTheme(model.config.Theme);
    status("Defaults restored - review and Save to apply.", "ok");
    syncDirty();
  } catch (err) {
    status(errorText(err, ""), "err");
  }
});

window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
