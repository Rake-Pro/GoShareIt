<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GoShareIt Settings</title>
<style>
  /* Token structure is three-state on purpose: :root carries the light
     defaults, the media block applies dark ONLY when the config has not
     forced light, and the [data-theme] blocks let applyTheme() override
     prefers-color-scheme in either direction. */
  :root {
    color-scheme: light dark;
    --bg-window: #ececec;
    --bg-sidebar: #e9e9eb;
    --bg-bar: #e9e9eb;
    --bg-content: #ffffff;
    --bg-card: #ffffff;
    --bg-control: #ffffff;
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #a1a1a6;
    --hairline: rgba(0, 0, 0, 0.12);
    --hairline-card: rgba(0, 0, 0, 0.09);
    --accent: #0a84ff;
    --switch-off: rgba(0, 0, 0, 0.17);
    --focus-ring: rgba(10, 132, 255, 0.55);
    --keycap-bg: linear-gradient(180deg, #ffffff, #eeeeef);
    --ok: #1f9d55;
    --err: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-window: #1e1e1e;
      --bg-sidebar: #262629;
      --bg-bar: #262629;
      --bg-content: #1e1e1e;
      --bg-card: #2c2c2e;
      --bg-control: #3a3a3c;
      --text-primary: #f5f5f7;
      --text-secondary: #98989d;
      --text-tertiary: #6e6e73;
      --hairline: rgba(255, 255, 255, 0.13);
      --hairline-card: rgba(255, 255, 255, 0.1);
      --accent: #0a84ff;
      --switch-off: rgba(255, 255, 255, 0.18);
      --focus-ring: rgba(10, 132, 255, 0.65);
      --keycap-bg: linear-gradient(180deg, #48484a, #3a3a3c);
      --ok: #34c07a;
      --err: #ff6b6b;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg-window: #ececec;
    --bg-sidebar: #e9e9eb;
    --bg-bar: #e9e9eb;
    --bg-content: #ffffff;
    --bg-card: #ffffff;
    --bg-control: #ffffff;
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #a1a1a6;
    --hairline: rgba(0, 0, 0, 0.12);
    --hairline-card: rgba(0, 0, 0, 0.09);
    --accent: #0a84ff;
    --switch-off: rgba(0, 0, 0, 0.17);
    --focus-ring: rgba(10, 132, 255, 0.55);
    --keycap-bg: linear-gradient(180deg, #ffffff, #eeeeef);
    --ok: #1f9d55;
    --err: #d64545;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-window: #1e1e1e;
    --bg-sidebar: #262629;
    --bg-bar: #262629;
    --bg-content: #1e1e1e;
    --bg-card: #2c2c2e;
    --bg-control: #3a3a3c;
    --text-primary: #f5f5f7;
    --text-secondary: #98989d;
    --text-tertiary: #6e6e73;
    --hairline: rgba(255, 255, 255, 0.13);
    --hairline-card: rgba(255, 255, 255, 0.1);
    --accent: #0a84ff;
    --switch-off: rgba(255, 255, 255, 0.18);
    --focus-ring: rgba(10, 132, 255, 0.65);
    --keycap-bg: linear-gradient(180deg, #48484a, #3a3a3c);
    --ok: #34c07a;
    --err: #ff6b6b;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-window);
    color: var(--text-primary);
    font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  input, textarea { -webkit-user-select: text; user-select: text; }

  .body { flex: 1; display: flex; min-height: 0; }

  /* sidebar */
  .sidebar {
    width: 180px; flex: none;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--hairline);
    display: flex; flex-direction: column;
  }
  .sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
  .nav-item {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 4px 8px; margin-bottom: 1px;
    border: none; border-radius: 6px; background: transparent;
    color: var(--text-primary);
    font-family: inherit; font-size: 13px; text-align: left; cursor: pointer;
  }
  .nav-item:hover { background: rgba(127, 127, 127, 0.12); }
  .nav-item.active, .nav-item.active:hover { background: var(--accent); color: #fff; }
  .nav-item:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .nav-item.dim .nav-label { opacity: 0.45; }
  .nav-item.dim .icon-sq { opacity: 0.5; }
  .nav-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-sq {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35);
  }
  .icon-sq svg { width: 13px; height: 13px; }

  .sidebar-footer { flex: none; padding: 8px 12px 10px; border-top: 1px solid var(--hairline); }
  .version { font-size: 11px; color: var(--text-secondary); }
  .config-path {
    font-size: 10px; color: var(--text-tertiary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }

  /* content + panes */
  .content { flex: 1; overflow-y: auto; padding: 20px 24px 24px; background: var(--bg-content); }
  .pane h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .pane-note { font-size: 11.5px; color: var(--text-secondary); margin: 0 0 14px; line-height: 1.5; max-width: 460px; }
  .pane > h1 + .group, .pane > .pane-note + .group { margin-top: 14px; }
  .group { margin-bottom: 16px; }
  .caption { font-size: 11px; color: var(--text-secondary); margin: 0 0 6px 2px; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--hairline-card);
    border-radius: 10px;
    overflow: hidden;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 9px 12px; min-height: 20px;
  }
  .row + .row { border-top: 1px solid var(--hairline-card); }
  .row.stacked { flex-direction: column; align-items: stretch; }
  .row-text { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .row-label { font-size: 13px; color: var(--text-primary); }
  .row-hint { font-size: 11px; color: var(--text-secondary); line-height: 1.4; }
  .row-control { flex: none; display: flex; align-items: center; gap: 8px; }
  .row.stacked .row-control { flex: 1 1 100%; flex-wrap: wrap; margin-top: 6px; }
  /* .dim greys out what does not apply while uploads are off; the inputs
     themselves are also really disabled by syncEnabledState(). */
  .dim { opacity: 0.42; }
  .hidden { display: none !important; }

  /* toggle switch */
  .switch { position: relative; width: 34px; height: 20px; flex: none; display: inline-block; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; background: var(--switch-off); border-radius: 999px; transition: background .15s ease; }
  .switch .thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .15s ease; }
  .switch input:checked ~ .track { background: var(--accent); }
  .switch input:checked ~ .track .thumb { transform: translateX(14px); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .switch input:disabled { cursor: default; }
  .switch input:disabled ~ .track { opacity: .55; }

  /* popup select */
  .popup { position: relative; display: inline-flex; align-items: center; }
  .popup select {
    appearance: none; -webkit-appearance: none;
    font-family: inherit; font-size: 12.5px;
    color: var(--text-primary); background: var(--bg-control);
    border: 1px solid var(--hairline); border-radius: 6px;
    padding: 4px 24px 4px 9px; min-width: 140px; max-width: 300px;
  }
  .popup select:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .popup .chevron {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 9px; height: 9px; pointer-events: none;
    fill: none; stroke: var(--text-secondary); stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .input {
    font-family: inherit; font-size: 12.5px;
    color: var(--text-primary); background: var(--bg-control);
    border: 1px solid var(--hairline); border-radius: 6px; padding: 5px 9px;
  }
  .input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .input.w-sm { width: 74px; }
  .input.w-md { width: 190px; }
  .input.w-lg { width: 250px; }
  textarea.input {
    width: 100%; resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
  }

  .keycap {
    font-family: inherit; font-size: 12px; text-align: center;
    color: var(--text-primary); background: var(--keycap-bg);
    border: 1px solid var(--hairline); border-bottom-width: 2px;
    border-radius: 6px; padding: 5px 10px; width: 190px;
  }
  .keycap:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .keycap.recording { outline: 2px solid var(--focus-ring); outline-offset: 1px; border-style: dashed; }
  .keycap + [data-record] { margin-left: 6px; }

  .chip-check { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-primary); padding: 3px 6px 3px 0; }
  .chip-check input { accent-color: var(--accent); width: 13px; height: 13px; }

  .btn { font-family: inherit; font-size: 12.5px; padding: 6px 14px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
  .btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-plain { background: var(--bg-control); border-color: var(--hairline); color: var(--text-primary); }
  .btn-subtle { background: transparent; border-color: transparent; color: var(--text-secondary); }
  .btn-pill { background: transparent; border: 1px solid var(--hairline); border-radius: 999px; color: var(--text-primary); padding: 5px 13px; font-size: 12px; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn.danger { background: var(--err); border-color: transparent; color: #fff; }

  /* footer */
  footer {
    flex: none; min-height: 50px;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    background: var(--bg-bar);
    border-top: 1px solid var(--hairline);
  }
  #status {
    flex: 1; min-width: 0; font-size: 11.5px; line-height: 1.35;
    color: var(--text-secondary); white-space: pre-wrap;
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
</style>
</head>
<body>
<div class="body">
  <nav class="sidebar">
    <div class="sidebar-list" role="tablist" id="nav"></div>
    <div class="sidebar-footer">
      <div class="version" id="ver"></div>
      <div class="config-path" id="cfgpath"></div>
    </div>
  </nav>
  <main class="content" id="form"></main>
</div>
<footer>
  <div id="status"></div>
  <button type="button" id="reset" class="btn btn-subtle">Reset to defaults</button>
  <button type="button" id="discard" class="btn btn-plain">Discard Changes</button>
  <button type="button" id="save" class="btn btn-accent">Save</button>
</footer>
<script>
"use strict";

// Declarative form schema. path = dot-path into the Config object (Go field
// names, since config.Config has no json tags). Special types "secret:*" map
// to the write-only SaveRequest fields. Each section also carries the sidebar
// glyph (raw inline SVG) and the tint of its rounded icon square.
const SCHEMA = [
  { title: "Appearance", tint: "#8e8e93",
    icon: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#fff"/><path d="M12 4a8 8 0 000 16z" fill="rgba(0,0,0,.35)"/></svg>`,
    fields: [
    { p: "Theme", l: "Theme", t: "select", opts: ["system", "light", "dark"] },
  ]},
  { title: "Upload", tint: "#0a84ff",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16a4 4 0 01.5-7.9A5 5 0 0117 9a3.5 3.5 0 01-.5 7H7z"/><path d="M12 12v6M9.5 14.5L12 12l2.5 2.5"/></svg>`,
    fields: [
    { p: "Upload.Enabled", l: "Upload captures", t: "bool",
      hint: "off = local-only: no data leaves this machine, server settings optional" },
    { p: "Upload.Destination", l: "Destination", t: "select",
      opts: [
        { v: "nextcloud", l: "Nextcloud" },
        { v: "s3", l: "S3-compatible (AWS / B2 / MinIO / R2)" },
        { v: "sftp", l: "SFTP" },
        { v: "webdav", l: "WebDAV" },
        { v: "custom", l: "Custom HTTP" },
      ],
      hint: "fields for the selected destination appear below" },
    { p: "Upload.AllowInsecureHTTP", l: "Allow insecure http:// server URL", t: "bool",
      hint: "off = https required for the Nextcloud/WebDAV/Custom endpoint URL (loopback and LAN addresses are always allowed); on sends the credential in cleartext" },
  ],
    // destPanels: one sub-panel per destination, all rendered in the DOM
    // inside a single inset .destpanel container; only the sub-panel that
    // matches Upload.Destination stays visible (see syncDestPanel()).
    destPanels: [
      { key: "nextcloud", label: "Nextcloud settings", fields: [
        { p: "Nextcloud.BaseURL",   l: "Server URL",   t: "text", hint: "https://cloud.example.com" },
        { p: "Nextcloud.Username",  l: "Username",     t: "text" },
        { p: "Nextcloud.DavUser",   l: "DAV user",     t: "text", hint: "blank = derived from username" },
        { p: "Nextcloud.RemoteDir", l: "Remote folder",t: "text", hint: "blank = files root" },
        { p: "@password",           l: "App password", t: "secret" },
        { p: "Upload.ShareExpireDays", l: "Share expiry (days)", t: "number", hint: "0 = never" },
        { p: "Upload.SharePassword",   l: "Share password", t: "text", hint: "blank = none" },
        { p: "Upload.DirectLink",      l: "Direct preview link", t: "bool" },
      ]},
      { key: "s3", label: "S3-compatible settings", fields: [
        { p: "S3.Endpoint",  l: "Endpoint", t: "text", hint: "host[:port], no scheme, e.g. s3.us-west-002.backblazeb2.com" },
        { p: "S3.Region",    l: "Region",   t: "text" },
        { p: "S3.Bucket",    l: "Bucket",   t: "text" },
        { p: "S3.AccessKey", l: "Access key", t: "text" },
        { p: "@s3_secret_key", l: "Secret key", t: "secret" },
        { p: "S3.Prefix",       l: "Key prefix",         t: "text", hint: "blank = bucket root" },
        { p: "S3.URLTemplate",  l: "Public URL template", t: "text", hint: "{bucket} {key} {name}; blank = presigned GET" },
        { p: "S3.UsePathStyle", l: "Path-style addressing", t: "bool", hint: "required by most non-AWS providers" },
        { p: "S3.PresignSeconds", l: "Presign TTL (seconds)", t: "number", hint: "used when URL template is blank; default/max 604800" },
      ]},
      { key: "sftp", label: "SFTP settings", fields: [
        { p: "SFTP.Host", l: "Host", t: "text" },
        { p: "SFTP.Port", l: "Port", t: "number", hint: "default 22" },
        { p: "SFTP.User", l: "User", t: "text" },
        { p: "@sftp_password", l: "Password", t: "secret", hint: "used when no private key is set below" },
        { p: "SFTP.PrivateKeyFile", l: "Private key file", t: "text", hint: "path to a PEM file on this machine; takes precedence over password" },
        { p: "@sftp_passphrase", l: "Key passphrase", t: "secret", hint: "only needed if the private key above is encrypted" },
        { p: "SFTP.RemoteDir",   l: "Remote folder", t: "text" },
        { p: "SFTP.URLTemplate", l: "Public URL template", t: "text", hint: "{name}" },
        { p: "SFTP.HostKeyFingerprint", l: "Host key fingerprint", t: "text",
          hint: "SHA256:... (ssh-keygen -lf); blank leaves the host key unverified" },
      ]},
      { key: "webdav", label: "WebDAV settings", fields: [
        { p: "WebDAV.BaseURL",  l: "Server URL", t: "text", hint: "https://webdav.example.com/remote.php/dav/files/uploads" },
        { p: "WebDAV.Username", l: "Username", t: "text" },
        { p: "@webdav_password", l: "Password", t: "secret" },
        { p: "WebDAV.RemoteDir",   l: "Remote folder", t: "text" },
        { p: "WebDAV.URLTemplate", l: "Public URL template", t: "text", hint: "{name} {path}; blank = the PUT URL" },
      ]},
      { key: "custom", label: "Custom HTTP settings", fields: [
        { p: "@custom_preset", l: "Preset", t: "preset", hint: "prefills the fields below client-side; still requires Save" },
        { p: "Custom.Method", l: "Method", t: "select", opts: ["POST", "PUT"] },
        { p: "Custom.URL",    l: "URL", t: "text", hint: "supports {name} {mime}" },
        { p: "Custom.Headers", l: "Headers", t: "kv", hint: "one key=value per line; values support {name} {mime} {secret}" },
        { p: "Custom.Body",      l: "Body", t: "select", opts: ["multipart", "raw"] },
        { p: "Custom.FileField", l: "File field", t: "text", hint: "multipart field name for the file; default \"file\"" },
        { p: "Custom.ExtraFields", l: "Extra fields", t: "kv",
          hint: "multipart only; one key=value per line; values support {name} {mime} {secret}" },
        { p: "@custom_secret", l: "Secret", t: "secret", hint: "substitutes {secret} in headers/extra fields above" },
        { p: "Custom.ResponseURLPath",       l: "Response URL path",        t: "text", hint: "dot path into a JSON response, e.g. data.link" },
        { p: "Custom.ResponseDirectURLPath", l: "Response direct URL path", t: "text", hint: "blank = same as response URL path" },
        { p: "Custom.ResponseURLRegex",      l: "Response URL regex",       t: "text", hint: "used instead of response URL path; first capture group is the URL" },
      ]},
    ],
    tailFields: [
      { p: "Upload.FilenameTemplate", l: "Filename template", t: "text", hint: "{date} {time} {datetime} {rand} {ext}" },
    ],
  },
  { title: "After capture", tint: "#30d158",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.5-2.5h5L16 7"/><circle cx="12" cy="13.5" r="3.3"/></svg>`,
    fields: [
    { p: "AfterCapture.CopyImageToClipboard", l: "Copy image to clipboard", t: "bool" },
    { p: "AfterCapture.SaveLocal", l: "Keep a local copy", t: "bool" },
    { p: "AfterCapture.SaveDir",   l: "Local save folder", t: "dir" },
  ]},
  { title: "After upload", tint: "#ff9f0a",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5l5-5"/><path d="M8 16l-1.5 1.5a3 3 0 01-4.2-4.2L4 11.6"/><path d="M16 8l1.5-1.5a3 3 0 014.2 4.2L20 12.4"/></svg>`,
    fields: [
    { p: "AfterUpload.CopyURLToClipboard", l: "Copy link to clipboard", t: "bool" },
    { p: "AfterUpload.Notify", l: "Show notification", t: "bool" },
  ]},
  { title: "Hotkeys", tint: "#ff375f",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6 10h.01M9 10h.01M12 10h.01M15 10h.01M18 10h.01M7 14h10"/></svg>`,
    note: "Click Record and press a key combination, or type it. Comma-separate alternatives, e.g. Cmd+Shift+1, Ctrl+PrintScreen. Leave a field blank to disable that hotkey.",
    fields: [
    { p: "Hotkeys.Region",     l: "Capture region", t: "text" },
    { p: "Hotkeys.FullScreen", l: "Capture full screen", t: "text" },
    { p: "Hotkeys.Window",     l: "Capture window", t: "text" },
    { p: "Hotkeys.RegionEdit",     l: "Capture region + edit", t: "text", hint: "always opens the editor" },
    { p: "Hotkeys.FullScreenEdit", l: "Capture full screen + edit", t: "text" },
    { p: "Hotkeys.WindowEdit",     l: "Capture window + edit", t: "text" },
    { p: "Hotkeys.UploadToggle", l: "Toggle uploads", t: "text", hint: "flip local-only mode on/off" },
    { p: "Hotkeys.Record",     l: "Toggle recording", t: "text" },
    { p: "Hotkeys.Quit",       l: "Quit", t: "text" },
    { p: "Hotkeys.DisableSnippingPrintScreen", l: "Free the PrintScreen key", t: "bool", os: "windows",
      hint: "turns off Windows' \"Use the Print screen key to open screen capture\" so Snipping Tool stops claiming PrintScreen; sign out and back in if a PrintScreen hotkey still does not fire" },
  ]},
  { title: "Editor", tint: "#5e5ce6",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 10-10-3-3L5 16z"/><path d="M14 7l3 3"/></svg>`,
    fields: [
    { p: "Editor.Enabled", l: "Open editor after capture", t: "bool" },
    { p: "Editor.OnModes", l: "For capture modes", t: "checks", opts: ["region", "fullscreen", "window"] },
    { p: "Editor.Tools",   l: "Tools", t: "checks",
      opts: ["crop","arrow","rect","ellipse","line","freehand","text","blur","pixelate","highlight","step"] },
    { p: "Editor.DefaultTool", l: "Default tool", t: "select",
      opts: ["crop","arrow","rect","ellipse","line","freehand","text","blur","pixelate","highlight","step"] },
    { p: "Editor.Color",       l: "Color", t: "text", hint: "#rrggbb" },
    { p: "Editor.StrokeWidth", l: "Stroke width", t: "number", hint: "px, editor default" },
  ]},
  { title: "Updates", tint: "#64d2ff",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0113.7-5.6L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 01-13.7 5.6L4 16"/><path d="M4 20v-4h4"/></svg>`,
    fields: [
    { p: "Update.Enabled", l: "Check for updates", t: "bool" },
    { p: "Update.IntervalHours", l: "Check interval (hours)", t: "number" },
  ]},
  { title: "Logging", tint: "#636366",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>`,
    fields: [
    { p: "Logging.Level", l: "Level", t: "select", opts: ["trace","debug","info","warn","error"] },
  ]},
];

// SECRET_FIELDS maps a "@..." schema path to the LoadResult "has*" flag and
// the SaveRequest write-only field it collects into. @password is handled
// separately in render()/collect() because of the browser sign-in flow.
const SECRET_FIELDS = {
  "@password":        { has: "hasPassword",       saveKey: "newPassword" },
  "@s3_secret_key":   { has: "hasS3SecretKey",     saveKey: "newS3SecretKey" },
  "@sftp_password":   { has: "hasSFTPPassword",    saveKey: "newSFTPPassword" },
  "@sftp_passphrase": { has: "hasSFTPPassphrase",  saveKey: "newSFTPPassphrase" },
  "@webdav_password": { has: "hasWebDAVPassword",  saveKey: "newWebDAVPassword" },
  "@custom_secret":   { has: "hasCustomSecret",    saveKey: "newCustomSecret" },
};

// secretEnvVar returns the *_env value that sources a "@..." secret field
// ("" if it is file-sourced or has no env option).
function secretEnvVar(p) {
  switch (p) {
    case "@password":        return model.config.Nextcloud.PasswordEnv || "";
    case "@s3_secret_key":   return model.config.S3.SecretKeyEnv || "";
    case "@sftp_password":   return model.config.SFTP.PasswordEnv || "";
    case "@sftp_passphrase": return model.config.SFTP.PassphraseEnv || "";
    case "@webdav_password": return model.config.WebDAV.PasswordEnv || "";
    case "@custom_secret":   return model.config.Custom.SecretEnv || "";
    default:                 return "";
  }
}

const $ = (id) => document.getElementById(id);
let model = null;
let presets = {}; // custom-uploader presets, loaded from the backend at init
let pendingLoginPassword = ""; // minted by browser sign-in, applied on Save
let activePane = 0; // sidebar selection, preserved across re-renders

const CHEVRON = `<svg class="chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>`;

function kvToText(obj) {
  return Object.entries(obj || {}).map(([k, v]) => `${k}=${v}`).join("\n");
}
function textToKv(text) {
  const out = {};
  for (const line of text.split("\n")) {
    const t = line.trim();
    if (!t) continue;
    const i = t.indexOf("=");
    if (i < 0) continue;
    out[t.slice(0, i).trim()] = t.slice(i + 1);
  }
  return out;
}

const get = (obj, path) => path.split(".").reduce((o, k) => (o ? o[k] : undefined), obj);
const set = (obj, path, v) => {
  const keys = path.split("."); const last = keys.pop();
  keys.reduce((o, k) => (o[k] ??= {}), obj)[last] = v;
};

function fieldId(p) { return "f_" + p.replace(/[.@]/g, "_"); }

// paneId maps a section title to its pane element id; the sidebar button
// points at the same id via data-pane.
function paneId(title) { return "pane_" + title.replace(/[^a-z0-9]+/gi, "_").toLowerCase(); }

// allFields flattens a SCHEMA section into its plain fields plus (if present)
// every destPanels sub-panel's fields and tailFields, in DOM order. Used by
// collect() so every rendered input - visible or hidden behind the
// destination swap or the pane switch - is still read back.
function allFields(sec) {
  const out = [...sec.fields];
  if (sec.destPanels) for (const panel of sec.destPanels) out.push(...panel.fields);
  if (sec.tailFields) out.push(...sec.tailFields);
  return out;
}

// renderFieldRow builds one .row element for a schema field. Shared by the
// top-level section loop and the destPanels sub-panel loop in render().
function renderFieldRow(f) {
  const cfg = model.config;
  const row = document.createElement("div");
  const id = fieldId(f.p);
  row.dataset.row = id;
  // OS-specific fields stay in the DOM (collect() reads every input) but are
  // hidden on other platforms.
  if (f.os && model.os && f.os !== model.os) row.style.display = "none";
  let stacked = false;
  let control = "";
  const val = f.p.startsWith("@") ? "" : get(cfg, f.p);
  if (f.t === "text") {
    // Hotkeys read as key combinations, so they get the keycap treatment.
    const hk = f.p.startsWith("Hotkeys.");
    const cls = hk ? "keycap" : "input w-lg";
    control = `<input type="text" class="${cls}" id="${id}" value="${esc(val ?? "")}">` +
      (hk ? `<button type="button" class="btn btn-plain btn-sm" data-record="${id}" title="Press a key combination to fill this field">Record</button>` : "");
  } else if (f.t === "dir") {
    control = `<input type="text" class="input w-md" id="${id}" value="${esc(val ?? "")}">` +
      `<button type="button" class="btn btn-plain btn-sm" data-browse="${id}">Browse...</button>`;
  } else if (f.t === "number") {
    control = `<input type="number" class="input w-sm" id="${id}" min="0" step="1" value="${Number(val ?? 0)}">`;
  } else if (f.t === "bool") {
    // *bool fields default to true when null. The checkbox is a real input
    // inside the switch, so every id/checked path keeps working.
    const defaultTrue = f.p === "Update.Enabled" || f.p === "Upload.Enabled";
    const on = defaultTrue ? (val !== false) : !!val;
    control = `<label class="switch"><input type="checkbox" id="${id}" ${on ? "checked" : ""}>` +
      `<span class="track"><span class="thumb"></span></span></label>`;
  } else if (f.t === "select") {
    // opts entries are either a plain string (value === label) or
    // { v, l } when the displayed label needs to differ from the enum value.
    control = `<span class="popup"><select id="${id}">` + f.opts.map(o => {
      const v = (typeof o === "object") ? o.v : o;
      const l = (typeof o === "object") ? o.l : o;
      return `<option value="${esc(v)}" ${v === val ? "selected" : ""}>${esc(l)}</option>`;
    }).join("") + `</select>${CHEVRON}</span>`;
  } else if (f.t === "checks") {
    stacked = true;
    const cur = new Set(val || []);
    control = f.opts.map(o =>
      `<label class="chip-check"><input type="checkbox" data-group="${id}" value="${o}" ${cur.has(o) ? "checked" : ""}>${o}</label>`).join("");
  } else if (f.t === "kv") {
    stacked = true;
    control = `<textarea class="input" id="${id}" rows="3">${esc(kvToText(val))}</textarea>`;
  } else if (f.t === "preset") {
    control = `<span class="popup"><select id="${id}"><option value="">(choose a preset)</option>` +
      Object.keys(presets).sort().map(k => `<option value="${k}">${esc(k)}</option>`).join("") + `</select>${CHEVRON}</span>` +
      `<button type="button" class="btn btn-plain btn-sm" id="btn_apply_preset">Apply preset</button>`;
  } else if (f.t === "secret") {
    const envVar = secretEnvVar(f.p);
    if (envVar) {
      // Env-sourced secrets are read-only here; Save() rejects file writes.
      // data-locked keeps syncEnabledState() from re-enabling it.
      control = `<input type="password" class="input w-md" id="${id}" disabled data-locked="1" placeholder="(managed by env var ${esc(envVar)})">`;
    } else {
      const has = model[SECRET_FIELDS[f.p].has];
      control = `<input type="password" class="input w-md" id="${id}" placeholder="${has ? "(unchanged)" : "not set - enter to configure"}">`;
      if (f.p === "@password") {
        // Browser sign-in (Login Flow v2): the server-side auth - incl.
        // OIDC/SSO - happens in the browser; we receive an app password.
        control += `<button type="button" class="btn btn-pill" id="btn_login">Sign in with browser</button>`;
      }
    }
  }
  row.className = stacked ? "row stacked" : "row";
  row.innerHTML = `<div class="row-text"><div class="row-label">${f.l}</div>` +
    (f.hint ? `<div class="row-hint">${f.hint}</div>` : "") + `</div>` +
    `<div class="row-control">${control}</div>`;
  return row;
}

// card builds a grouped inset card (hairline-separated rows) from a field
// list, optionally preceded by a small caption.
function card(fields, caption) {
  const group = document.createElement("div");
  group.className = "group";
  if (caption) {
    const c = document.createElement("div");
    c.className = "caption";
    c.textContent = caption;
    group.appendChild(c);
  }
  const box = document.createElement("div");
  box.className = "card";
  for (const f of fields) box.appendChild(renderFieldRow(f));
  group.appendChild(box);
  return group;
}

function render() {
  const nav = $("nav");
  const root = $("form");
  nav.innerHTML = "";
  root.innerHTML = "";
  for (const sec of SCHEMA) {
    const id = paneId(sec.title);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "nav-item";
    btn.dataset.pane = id;
    btn.setAttribute("role", "tab");
    btn.innerHTML = `<span class="icon-sq" style="background:${sec.tint}">${sec.icon}</span>` +
      `<span class="nav-label">${sec.title}</span>`;
    nav.appendChild(btn);

    // Every pane stays in the DOM (hidden via .hidden) so collect() can read
    // every input regardless of which pane is on screen.
    const s = document.createElement("section");
    s.className = "pane";
    s.id = id;
    s.dataset.section = sec.title;
    s.innerHTML = `<h1>${sec.title}</h1>` + (sec.note ? `<p class="pane-note">${sec.note}</p>` : "");
    s.appendChild(card(sec.fields));
    if (sec.destPanels) {
      // One container; each destination gets its own always-rendered card so
      // collect() keeps reading every input. syncDestPanel() toggles which
      // one is visible.
      const dp = document.createElement("div");
      dp.id = "destpanel";
      for (const panel of sec.destPanels) {
        const sub = card(panel.fields, panel.label);
        sub.id = "destpanel_" + panel.key;
        dp.appendChild(sub);
      }
      s.appendChild(dp);
    }
    if (sec.tailFields) {
      const tail = card(sec.tailFields);
      tail.id = "tailgroup";
      s.appendChild(tail);
    }
    root.appendChild(s);
  }
  $("cfgpath").textContent = model.configPath;
  $("cfgpath").title = model.configPath;
  $("ver").textContent = "v" + model.version;
  selectPane(activePane);
  syncDestPanel();
  syncEnabledState();
}

// selectPane shows exactly one pane and marks the matching sidebar item.
function selectPane(i) {
  const items = [...document.querySelectorAll(".nav-item")];
  if (i < 0 || i >= items.length) i = 0;
  activePane = i;
  items.forEach((b, n) => {
    b.classList.toggle("active", n === i);
    b.setAttribute("aria-selected", n === i ? "true" : "false");
  });
  const target = items[i] ? items[i].dataset.pane : "";
  document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("hidden", p.id !== target));
}

// syncDestPanel shows only the destPanels sub-panel matching the current
// Upload.Destination value; the rest get the .hidden class. All sub-panels
// stay in the DOM regardless, so collect() always has something to read.
function syncDestPanel() {
  const upload = SCHEMA.find((sec) => sec.destPanels);
  if (!upload) return;
  const destSel = $(fieldId("Upload.Destination"));
  const dest = destSel ? destSel.value : "";
  for (const panel of upload.destPanels) {
    const el = $("destpanel_" + panel.key);
    if (el) el.classList.toggle("hidden", panel.key !== dest);
  }
}

// syncEnabledState greys out everything that does not apply when uploads are
// off (local-only mode): the destination select, the whole destination
// panel, the filename template, and After upload (rows plus its sidebar
// item, which stays clickable). Which destination sub-panel is visible is
// handled separately by syncDestPanel().
function syncEnabledState() {
  const uploadsBox = $(fieldId("Upload.Enabled"));
  if (!uploadsBox) return;
  const uploadsOn = uploadsBox.checked;
  const destSel = $(fieldId("Upload.Destination"));
  if (destSel) destSel.disabled = !uploadsOn;
  const destRow = document.querySelector(`[data-row="${fieldId("Upload.Destination")}"]`);
  if (destRow) destRow.classList.toggle("dim", !uploadsOn);
  const panel = $("destpanel");
  if (panel) {
    panel.classList.toggle("dim", !uploadsOn);
    panel.querySelectorAll("input, select, textarea, button")
      .forEach((el) => { if (!el.dataset.locked) el.disabled = !uploadsOn; });
  }
  const filenameInput = $(fieldId("Upload.FilenameTemplate"));
  if (filenameInput) filenameInput.disabled = !uploadsOn;
  const tail = $("tailgroup");
  if (tail) tail.classList.toggle("dim", !uploadsOn);
  document.querySelectorAll(`[data-section="After upload"] input, [data-section="After upload"] select, [data-section="After upload"] button`)
    .forEach((el) => { el.disabled = !uploadsOn; });
  document.querySelectorAll(`[data-section="After upload"] .card`)
    .forEach((el) => el.classList.toggle("dim", !uploadsOn));
  const navItem = document.querySelector(`.nav-item[data-pane="${paneId("After upload")}"]`);
  if (navItem) navItem.classList.toggle("dim", !uploadsOn);
}

function collect() {
  const cfg = model.config;
  let newPassword = "";
  const secrets = { newS3SecretKey: "", newSFTPPassword: "", newSFTPPassphrase: "", newWebDAVPassword: "", newCustomSecret: "" };
  for (const sec of SCHEMA) {
    for (const f of allFields(sec)) {
      const id = fieldId(f.p);
      if (f.t === "preset") continue; // UI-only, not part of the config
      if (f.t === "secret") {
        const v = $(id).value;
        if (f.p === "@password") {
          // Manual entry wins; otherwise a pending browser sign-in applies.
          newPassword = v || pendingLoginPassword || "";
        } else {
          secrets[SECRET_FIELDS[f.p].saveKey] = v;
        }
        continue;
      }
      if (f.t === "checks") {
        const vals = [...document.querySelectorAll(`input[data-group="${id}"]:checked`)].map(x => x.value);
        set(cfg, f.p, vals);
      } else if (f.t === "bool") {
        set(cfg, f.p, $(id).checked);
      } else if (f.t === "number") {
        // Clamp to a non-negative integer: Go int fields reject floats at the
        // JSON bridge, and the config validator rejects negatives.
        set(cfg, f.p, Math.max(0, Math.round(Number($(id).value) || 0)));
      } else if (f.t === "kv") {
        set(cfg, f.p, textToKv($(id).value));
      } else {
        set(cfg, f.p, $(id).value);
      }
    }
  }
  return { config: cfg, newPassword, ...secrets };
}

// applyTheme stamps data-theme on <html> so the CSS overrides above take
// effect: "light"/"dark" force that theme, anything else (empty/"system")
// clears the attribute and lets prefers-color-scheme decide.
function applyTheme(theme) {
  const t = (theme === "light" || theme === "dark") ? theme : "";
  document.documentElement.setAttribute("data-theme", t);
}

// applyPreset fills the Custom section's inputs from a built-in preset
// (imgur/catbox/0x0). Client-side only - nothing is saved until the user
// clicks Save.
function applyPreset(key) {
  const p = presets[key];
  if (!p) return;
  $(fieldId("Custom.Method")).value = p.Method || "POST";
  $(fieldId("Custom.URL")).value = p.URL || "";
  $(fieldId("Custom.Headers")).value = kvToText(p.Headers);
  $(fieldId("Custom.Body")).value = p.Body || "multipart";
  $(fieldId("Custom.FileField")).value = p.FileField || "";
  $(fieldId("Custom.ExtraFields")).value = kvToText(p.ExtraFields);
  $(fieldId("Custom.ResponseURLPath")).value = p.ResponseURLPath || "";
  $(fieldId("Custom.ResponseDirectURLPath")).value = p.ResponseDirectURLPath || "";
  $(fieldId("Custom.ResponseURLRegex")).value = p.ResponseURLRegex || "";
  let msg = `Preset "${key}" applied to the Custom panel - review then Save.`;
  if (key === "imgur") msg += " Register your own client ID at api.imgur.com/oauth2/addclient and replace YOUR_CLIENT_ID in the Authorization header.";
  status(msg, "ok");
}

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

function status(msg, cls) { const el = $("status"); el.textContent = msg; el.className = cls || ""; }

function svc() {
  return window.go && window.go.settings && window.go.settings.Service;
}

async function init() {
  if (!svc()) { status("Wails runtime not available (browser preview?)", "err"); return; }
  try {
    presets = await svc().Presets();
    model = await svc().Load();
    render();
    applyTheme(model.config.Theme);
  } catch (e) {
    status("Load failed: " + e, "err");
  }
}

// Sidebar routing. The buttons are rebuilt by render(), so the listener sits
// on the list container.
$("nav").addEventListener("click", (e) => {
  const btn = e.target.closest(".nav-item");
  if (!btn) return;
  selectPane([...document.querySelectorAll(".nav-item")].indexOf(btn));
});

$("save").addEventListener("click", async () => {
  if (!model) return;
  $("save").disabled = true;
  status("Saving...");
  try {
    await svc().Save(collect());
    pendingLoginPassword = "";
    // Auto-close on success: the host blocks on this window and applies the
    // saved config (restarting itself) as soon as it exits, so closing here
    // is what makes Save take effect without further user action. The short
    // delay lets the confirmation register before the window disappears.
    status("Saved - applying...", "ok");
    setTimeout(() => {
      svc().CloseWindow().catch(() => {
        status("Saved. Close this window to apply.", "ok");
        $("save").disabled = false;
      });
    }, 600);
  } catch (e) {
    status(String(e), "err");
    $("save").disabled = false;
  }
});

// Discard Changes: close without saving. The helper exits 0 (no ExitSaved),
// so the host discards - same as closing the window by hand, but explicit.
$("discard").addEventListener("click", () => {
  svc().CloseWindow().catch(() => status("Close this window to discard your changes.", ""));
});

$("form").addEventListener("change", (e) => {
  if (e.target.id === fieldId("Upload.Enabled")) syncEnabledState();
  if (e.target.id === fieldId("Upload.Destination")) syncDestPanel();
  if (e.target.id === fieldId("Theme")) applyTheme(e.target.value);
});

// Delegated clicks for per-row buttons (rows re-render, this listener does not).
// Hotkey recorder: "Record" arms the next key chord and writes it into the
// field in the host parser's token format (Ctrl/Cmd/Win/Alt/Shift + key).
// Esc cancels, Backspace/Delete with no modifiers clears the field.
let recording = null; // { input, btn, label }
const CODE_TOKENS = {
  Space: "Space", PrintScreen: "PrintScreen", Backquote: "`", Minus: "-", Equal: "=",
  BracketLeft: "[", BracketRight: "]", Semicolon: ";", Quote: "'", Comma: ",",
  Period: ".", Slash: "/", Backslash: "\\",
};
function chordToken(e) {
  const c = e.code || "";
  let m;
  if ((m = /^Key([A-Z])$/.exec(c))) return m[1];
  if ((m = /^Digit([0-9])$/.exec(c))) return m[1];
  if ((m = /^(F[1-9]|F1[0-9]|F20)$/.exec(c))) return m[1];
  return CODE_TOKENS[c] || null;
}
function chordFromEvent(e) {
  const mac = model.os === "darwin";
  const mods = [];
  if (e.ctrlKey) mods.push("Ctrl");
  if (e.metaKey) mods.push(mac ? "Cmd" : "Win");
  if (e.altKey) mods.push(mac ? "Option" : "Alt");
  if (e.shiftKey) mods.push("Shift");
  const key = chordToken(e);
  if (!key) return null;
  // Bare letters/digits/punctuation would swallow normal typing system-wide;
  // F-keys and PrintScreen are fine on their own.
  if (!mods.length && !/^(F\d+|PrintScreen)$/.test(key)) return null;
  return [...mods, key].join("+");
}
function stopRecording() {
  if (!recording) return;
  recording.btn.textContent = recording.label;
  recording.input.classList.remove("recording");
  recording = null;
}
function startRecording(btn) {
  stopRecording();
  const input = $(btn.dataset.record);
  recording = { input, btn, label: btn.textContent };
  btn.textContent = "Press keys... (Esc cancels)";
  input.classList.add("recording");
  input.focus();
}
function onRecordKey(e) {
  if (!recording) return;
  // PrintScreen only reports keyup on Windows; everything else on keydown.
  if (e.type === "keyup" && e.code !== "PrintScreen") return;
  if (e.type === "keydown" && e.code === "PrintScreen") { e.preventDefault(); return; }
  e.preventDefault(); e.stopPropagation();
  if (["Control", "Shift", "Alt", "Meta"].includes(e.key)) return;
  if (e.key === "Escape") { stopRecording(); return; }
  if ((e.key === "Backspace" || e.key === "Delete") && !e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey) {
    recording.input.value = ""; stopRecording(); return;
  }
  const chord = chordFromEvent(e);
  if (!chord) { status("Add a modifier (Ctrl/Cmd/Alt/Shift) or use an F-key / PrintScreen", "err"); return; }
  recording.input.value = chord;
  status("", "");
  stopRecording();
}
document.addEventListener("keydown", onRecordKey, true);
document.addEventListener("keyup", onRecordKey, true);
document.addEventListener("mousedown", (e) => {
  if (recording && !e.target.closest("[data-record]")) stopRecording();
}, true);

$("form").addEventListener("click", async (e) => {
  const rec = e.target.closest("[data-record]");
  if (rec) { if (recording && recording.btn === rec) stopRecording(); else startRecording(rec); return; }
  const browse = e.target.closest("[data-browse]");
  if (browse) {
    try {
      const dir = await svc().PickDirectory();
      if (dir) $(browse.dataset.browse).value = dir;
    } catch (err) { status(String(err), "err"); }
    return;
  }
  if (e.target.id === "btn_apply_preset") {
    const key = $(fieldId("@custom_preset")).value;
    if (!key) return;
    applyPreset(key);
    return;
  }
  if (e.target.id === "btn_login") {
    const base = $(fieldId("Nextcloud.BaseURL")).value;
    e.target.disabled = true;
    status("Complete the sign-in in your browser (waits up to 5 minutes)...");
    try {
      const res = await svc().BrowserLogin(base);
      $(fieldId("Nextcloud.Username")).value = res.loginName;
      pendingLoginPassword = res.appPassword;
      status("Signed in as " + res.loginName + " - nothing is stored until you Save.", "ok");
    } catch (err) {
      status(String(err), "err");
    } finally {
      e.target.disabled = false;
    }
  }
});

// Reset to defaults: two-step confirm, and nothing is applied until Save.
let resetArmed = 0;
function disarmReset() {
  resetArmed = 0;
  const b = $("reset");
  b.classList.remove("danger");
  b.textContent = "Reset to defaults";
}
$("reset").addEventListener("click", async () => {
  const now = Date.now();
  if (!resetArmed || now - resetArmed > 6000) {
    resetArmed = now;
    $("reset").classList.add("danger");
    $("reset").textContent = "Confirm reset";
    status("This replaces ALL settings with factory defaults (saved secrets stay on disk). Click again to confirm - nothing is applied until you Save.", "err");
    setTimeout(() => { if (resetArmed === now) disarmReset(); }, 6000);
    return;
  }
  disarmReset();
  pendingLoginPassword = "";
  try {
    const res = await svc().ResetDefaults();
    model = res;
    render();
    applyTheme(model.config.Theme);
    status("Defaults restored - review and Save to apply.", "ok");
  } catch (err) {
    status(String(err), "err");
  }
});
