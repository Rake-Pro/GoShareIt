# Release: promotion-PR merge into main mints the next semver tag, then the
# three OS jobs in package.yml build and package the app, and publish attaches
# everything to a GitHub Release. That release feed is what the in-app updater
# (internal/core/update) consumes - asset names must stay in sync with
# update.AssetName().
#
# Artifact matrix:
#   macOS    GoShareIt_<ver>_darwin_universal.dmg  (human install)
#            GoShareIt_<ver>_darwin_universal.zip  (updater feed, whole .app)
#   Windows  GoShareIt_<ver>_windows_amd64_setup.exe (Inno Setup, per-user)
#            GoShareIt_<ver>_windows_amd64.zip       (updater feed, loose exes)
#            GoShareIt_<ver>_windows_amd64_msstore_upload.msix (workflow artifact
#            only - Partner Center upload package, unsigned, not sideloadable)
#   Linux    GoShareIt_<ver>_linux_amd64.tar.gz      (BETA: updater feed + human
#            install, loose host/editor/settings binaries, cgo, GTK3; not yet
#            validated on real desktops)
#   checksums.txt (sha256; the updater fails closed without it)
#
# Signing secrets and their gating are documented in package.yml. The dev
# channel (ci.yml publish-dev) reuses the same package jobs for dev-<sha>
# prereleases; those never match the v* trigger or the v* tag listing here.
name: Release

on:
  # Normal path: a promotion PR merges into main; this run mints the next
  # semver tag and builds from it, all in one workflow (a tag pushed with
  # GITHUB_TOKEN cannot trigger another workflow, so nothing is chained).
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve or mint the release tag
        id: next
        run: |
          set -euo pipefail
          emit() {
            echo "tag=$1" >> "$GITHUB_OUTPUT"
            echo "version=${1#v}" >> "$GITHUB_OUTPUT"
          }

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            emit "${GITHUB_REF_NAME}"
            exit 0
          fi

          # Re-runs (e.g. a failed build retried via workflow_dispatch) reuse
          # the existing tag; publish uploads idempotently.
          existing=$(git tag --points-at HEAD -l 'v*' | head -1)
          if [ -n "${existing}" ]; then
            echo "HEAD already tagged ${existing}; rebuilding it."
            emit "${existing}"
            exit 0
          fi

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Not main and HEAD untagged; nothing to release."
            emit ""
            exit 0
          fi

          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "${latest}" ]; then
            # Versioning restarted at the 0.0.1 baseline; 1.0.0 is reserved
            # for the public release.
            next="v0.0.1"
          else
            # The merge commit itself is not one of the PR's commits, so the
            # commits/{sha}/pulls lookup returns [] for a promotion merge and
            # the release:minor/major labels were ignored (v0.3.2 shipped where
            # v0.4.0 was intended). Read the PR number from the merge subject
            # first ("Merge pull request #N from ..."), then fall back.
            pr=$(git log -1 --format=%s "${GITHUB_SHA}" | sed -n 's/^Merge pull request #\([0-9]*\) .*/\1/p')
            if [ -n "${pr}" ]; then
              labels=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" \
                --jq '[.labels[].name] | join(",")' || echo "")
            else
              labels=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                --jq '[.[].labels[].name] | join(",")' || echo "")
            fi
            bump=patch
            case ",${labels}," in
              *,release:major,*) bump=major ;;
              *,release:minor,*) bump=minor ;;
            esac
            IFS=. read -r ma mi pa <<< "${latest#v}"
            case "${bump}" in
              major) next="v$((ma+1)).0.0" ;;
              minor) next="v${ma}.$((mi+1)).0" ;;
              patch) next="v${ma}.${mi}.$((pa+1))" ;;
            esac
          fi

          # The checkout keeps no credentials, so the tag is created through the API
          # with the job token instead of git push.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${next}" -f sha="${GITHUB_SHA}" --silent
          emit "${next}"
  # The OS build + package jobs live in package.yml (shared with the dev
  # channel in ci.yml); their outputs arrive as the artifacts macos, windows
  # and linux.
  package:
    needs: [version]
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/package.yml
    with:
      ref: refs/tags/${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
      channel: stable
    secrets: inherit

  publish:
    needs: [version, package]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          # Only the packaged outputs; the windows-unsigned-* artifacts are
          # SignPath inputs and must not reach the release.
          pattern: "{macos,windows,linux}"
          merge-multiple: true

      - name: Checksums
        run: |
          cd assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create or update release
        run: |
          set -euo pipefail
          notes="Windows: the binaries are not code-signed. If Windows 11 Smart App Control says \"Part of this app has been blocked\", turn it off (Windows Security > App & browser control > Smart App Control settings > Off) - there is no per-app exception. Details: README, \"Windows says Part of this app has been blocked\". A SmartScreen warning is different: More info > Run anyway.

          Linux (BETA): the desktop shell is new and not yet validated on real desktops. The tar.gz holds the three binaries; see the README's Linux section for the runtime packages (GTK 3, WebKitGTK 4.1, ffmpeg for recording) and the desktop entry."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Generated notes must span from the previous stable release: the
            # dev channel publishes dev-<sha> prereleases in between, and the
            # default "previous tag" would be one of those.
            prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts \
              --limit 1 --json tagName --jq '.[0].tagName // empty')
            gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" \
              --title "GoShareIt $TAG" --notes "$notes" --generate-notes \
              ${prev:+--notes-start-tag "$prev"}
          fi
