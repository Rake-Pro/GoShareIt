# TEMPORARY diagnostic for the Developer ID "no identity found" release
# failure. Reproduces release.yml's Sign keychain setup, then prints identity
# validity before/after adding build.keychain to the keychain SEARCH LIST
# (release.yml only sets it as the default keychain, which is enough to find
# the leaf but - the working theory - not enough for trust evaluation to see
# the imported intermediates). Delete this file once the release path signs.
name: Sign debug
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sign-debug:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
    steps:
      - name: Keychain setup (mirrors release.yml Sign)
        run: |
          set -euo pipefail
          echo "$MACOS_CERT_P12" | base64 -d > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERT_P12_PASSWORD" -T /usr/bin/codesign
          curl -fsSL -o /tmp/devid_g1.cer https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          curl -fsSL -o /tmp/devid_g2.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import /tmp/devid_g1.cer -k build.keychain
          security import /tmp/devid_g2.cer -k build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain >/dev/null
          rm /tmp/cert.p12 /tmp/devid_g1.cer /tmp/devid_g2.cer

      - name: Diagnostics with default keychain only (release.yml today)
        run: |
          set +e
          echo "== keychain search list =="
          security list-keychains
          echo "== certs in build.keychain (subject/issuer per cert) =="
          security find-certificate -a -p build.keychain > /tmp/certs.pem
          openssl crl2pkcs7 -nocrl -certfile /tmp/certs.pem | openssl pkcs7 -print_certs -noout
          echo "== ALL codesigning identities in build.keychain =="
          security find-identity -p codesigning build.keychain
          echo "== VALID codesigning identities in build.keychain =="
          security find-identity -v -p codesigning build.keychain
          echo "== VALID identities via search list (what codesign sees) =="
          security find-identity -v -p codesigning
          true

      - name: Add build.keychain to search list, retry
        run: |
          set +e
          security list-keychains -d user -s build.keychain
          echo "== search list now =="
          security list-keychains
          echo "== VALID identities via search list =="
          security find-identity -v -p codesigning
          echo 'int main(){return 0;}' > /tmp/t.c && clang /tmp/t.c -o /tmp/t
          echo "== codesign via search list =="
          codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID_APP" /tmp/t \
            && echo CODESIGN-OK-SEARCHLIST || echo CODESIGN-FAIL-SEARCHLIST
          echo "== codesign with explicit --keychain =="
          codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID_APP" --keychain build.keychain /tmp/t \
            && echo CODESIGN-OK-EXPLICIT || echo CODESIGN-FAIL-EXPLICIT
          echo "== codesign by identity SHA-1 hash (release.yml fix) =="
          IDENTITY_HASH=$(security find-identity -v -p codesigning build.keychain | awk '/^ *1\)/{print $2; exit}')
          echo "hash: $IDENTITY_HASH"
          codesign --force --options runtime --timestamp --sign "$IDENTITY_HASH" /tmp/t \
            && echo CODESIGN-OK-HASH || echo CODESIGN-FAIL-HASH
          true
